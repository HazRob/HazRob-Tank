name: ChemCore Next P01 independent JVM contract validation

on:
  push:
    branches: [feature/tank-v8-implementation]
    paths:
      - 'android/app/src/main/java/com/hazrob/tank/chemcore/next/**'
      - 'research/chemcore_next/tests/java/**'
      - '.github/workflows/chemcore-next-p01-jvm-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  next-p01-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile stand-alone Next source, no Android or V6 dependency
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/chemcore-next-p01
          find android/app/src/main/java/com/hazrob/tank/chemcore/next research/chemcore_next/tests/java \
            -name '*.java' ! -name 'NextP06PairedV6UciBenchmark.java' ! -name 'NextP06FingerprintDeviationAudit.java' -print0 | xargs -0 javac -encoding UTF-8 -Xlint:all -d build/chemcore-next-p01
      - name: Validate immutable contracts, sensor scalability and honest no-model result
        shell: bash
        run: |
          set -euo pipefail
          java -cp build/chemcore-next-p01 com.hazrob.tank.chemcore.next.ChemCoreNextContractSmoke \
            | tee build/chemcore-next-p01/P01-CONTRACT-TEST.log
          grep -q '^CHEMCORE_NEXT_P01_CORE_CONTRACT_SMOKE_PASS ' \
            build/chemcore-next-p01/P01-CONTRACT-TEST.log
      - name: Verify versioned immutable snapshot and decision replay
        shell: bash
        run: |
          set -euo pipefail
          java -cp build/chemcore-next-p01 com.hazrob.tank.chemcore.next.NextReplayCodecSmoke \
            | tee build/chemcore-next-p01/P01-REPLAY-TEST.log
          grep -q '^CHEMCORE_NEXT_P01_REPLAY_CODEC_PASS ' \
            build/chemcore-next-p01/P01-REPLAY-TEST.log
      - name: Verify P02.1 ADC1115 MQ divider resistance calculations
        shell: bash
        run: |
          set -euo pipefail
          java -cp build/chemcore-next-p01 com.hazrob.tank.chemcore.next.SignalPhysicsSmoke \
            | tee build/chemcore-next-p01/P02-SIGNAL-PHYSICS-TEST.log
          grep -q '^CHEMCORE_NEXT_P02_SIGNAL_PHYSICS_PASS ' \
            build/chemcore-next-p01/P02-SIGNAL-PHYSICS-TEST.log
      - name: Verify P02.2 device clean-air Rs vs source R0 and provenance
        shell: bash
        run: |
          set -euo pipefail
          java -cp build/chemcore-next-p01 com.hazrob.tank.chemcore.next.R0ReferenceMathSmoke \
            | tee build/chemcore-next-p01/P02-DUAL-R0-TEST.log
          grep -q '^CHEMCORE_NEXT_P02_DUAL_R0_PASS ' \
            build/chemcore-next-p01/P02-DUAL-R0-TEST.log
      - name: Verify P02.3 sensor quality and I2C conversion-ready provenance
        shell: bash
        run: |
          set -euo pipefail
          java -cp build/chemcore-next-p01 com.hazrob.tank.chemcore.next.SensorQualityGateSmoke \
            | tee build/chemcore-next-p01/P02-SENSOR-QUALITY-TEST.log
          grep -q '^CHEMCORE_NEXT_P02_SENSOR_QUALITY_PASS ' \
            build/chemcore-next-p01/P02-SENSOR-QUALITY-TEST.log
      - name: Verify P02.4 one-specialist response and conditional negative evidence
        shell: bash
        run: |
          set -euo pipefail
          java -cp build/chemcore-next-p01 com.hazrob.tank.chemcore.next.SingleSensorEvidenceGateSmoke \
            | tee build/chemcore-next-p01/P02-SINGLE-SENSOR-TEST.log
          grep -q '^CHEMCORE_NEXT_P02_SINGLE_SENSOR_EVIDENCE_PASS ' \
            build/chemcore-next-p01/P02-SINGLE-SENSOR-TEST.log
      - name: Verify P02.5 clean-air 8-MQ R_air calibration 180 plus 60 synthetic replay
        shell: bash
        run: |
          set -euo pipefail
          java -cp build/chemcore-next-p01 com.hazrob.tank.chemcore.next.CleanAirReplayExperimentSmoke \
            | tee build/chemcore-next-p01/P02-CLEAN-AIR-REPLAY-TEST.log
          grep -q '^CHEMCORE_NEXT_P02_CLEAN_AIR_REPLAY_PASS ' \
            build/chemcore-next-p01/P02-CLEAN-AIR-REPLAY-TEST.log
      - name: Test shared NH3 / NH4+ interpretations and one research evidence root
        shell: bash
        run: |
          set -euo pipefail
          java -cp build/chemcore-next-p01 com.hazrob.tank.chemcore.next.SharedSourceHypothesesSmoke \
            | tee build/chemcore-next-p01/NH3-NH4-SHARED-SOURCE-TEST.log
          grep -q '^CHEMCORE_NEXT_NH3_NH4_SHARED_SOURCE_PASS ' \
            build/chemcore-next-p01/NH3-NH4-SHARED-SOURCE-TEST.log
      - name: Verify P04.1 dual-source equation CurveExpert and calibration fail-closed
        shell: bash
        run: |
          set -euo pipefail
          java -cp build/chemcore-next-p01 com.hazrob.tank.chemcore.next.SourceCurveExpertSmoke \
            | tee build/chemcore-next-p01/P04-SOURCE-CURVE-EXPERT.log
          grep -q '^CHEMCORE_NEXT_P04_1_SOURCE_CURVE_PASS ' \
            build/chemcore-next-p01/P04-SOURCE-CURVE-EXPERT.log
      - name: Verify P04.2 FingerprintExpert independent source-space and 1/2/8 sensor subsets
        shell: bash
        run: |
          set -euo pipefail
          java -cp build/chemcore-next-p01 com.hazrob.tank.chemcore.next.FingerprintExpertSmoke \
            | tee build/chemcore-next-p01/P04-FINGERPRINT-EXPERT.log
          grep -q '^CHEMCORE_NEXT_P04_2_FINGERPRINT_PASS ' \
            build/chemcore-next-p01/P04-FINGERPRINT-EXPERT.log
      - name: Verify P04.3 source-locked temporal 4D features with real-clock guards
        shell: bash
        run: |
          set -euo pipefail
          java -cp build/chemcore-next-p01 com.hazrob.tank.chemcore.next.TemporalEvidenceExpertSmoke \
            | tee build/chemcore-next-p01/P04-TEMPORAL-EXPERT.log
          grep -q '^CHEMCORE_NEXT_P04_3_TEMPORAL_PASS ' \
            build/chemcore-next-p01/P04-TEMPORAL-EXPERT.log
      - name: Verify P04.4 source-qualified environmental 3D transform and abstentions
        shell: bash
        run: |
          set -euo pipefail
          java -cp build/chemcore-next-p01 com.hazrob.tank.chemcore.next.EnvironmentEvidenceExpertSmoke \
            | tee build/chemcore-next-p01/P04-ENVIRONMENT-EXPERT.log
          grep -q '^CHEMCORE_NEXT_P04_4_ENVIRONMENT_PASS ' \
            build/chemcore-next-p01/P04-ENVIRONMENT-EXPERT.log
      - name: Verify P04.6 correlated source-root fusion, alternative hypotheses and abstention
        shell: bash
        run: |
          set -euo pipefail
          java -cp build/chemcore-next-p01 com.hazrob.tank.chemcore.next.IndependentEvidenceLedgerSmoke \
            | tee build/chemcore-next-p01/P04-INDEPENDENT-ROOTS.log
          grep -q '^CHEMCORE_NEXT_P04_6_ROOT_FUSION_PASS ' \
            build/chemcore-next-p01/P04-INDEPENDENT-ROOTS.log
      - name: Verify P05.1 full-catalog source-linked candidate generation, 0 to more than 10
        shell: bash
        run: |
          set -euo pipefail
          java -cp build/chemcore-next-p01 com.hazrob.tank.chemcore.next.ResearchCandidateGeneratorSmoke \
            | tee build/chemcore-next-p01/P05-CANDIDATE-GENERATOR.log
          grep -q '^CHEMCORE_NEXT_P05_1_CANDIDATE_PASS ' \
            build/chemcore-next-p01/P05-CANDIDATE-GENERATOR.log
      - name: Verify P05.2 conditional negative requires separate reference and NOT_EVALUABLE
        shell: bash
        run: |
          set -euo pipefail
          java -cp build/chemcore-next-p01 com.hazrob.tank.chemcore.next.ConditionalEvidenceRouterSmoke \
            | tee build/chemcore-next-p01/P05-POLARITY-ROUTER.log
          grep -q '^CHEMCORE_NEXT_P05_2_POLARITY_PASS ' \
            build/chemcore-next-p01/P05-POLARITY-ROUTER.log
      - name: Replay owner-supplied real eight-MQ clean-air baseline as G1 algebra only
        shell: bash
        run: |
          set -euo pipefail
          java -cp build/chemcore-next-p01 com.hazrob.tank.chemcore.next.OwnerTankCleanAirBaselineSmoke \
            | tee build/chemcore-next-p01/OWNER-TANK-8MQ-AIR-BASELINE.log
          grep -q '^CHEMCORE_NEXT_OWNER_TANK_8MQ_AIR_BASELINE_PASS ' \
            build/chemcore-next-p01/OWNER-TANK-8MQ-AIR-BASELINE.log
      - name: Verify P05.3 graph dedup, alternatives and cross-source contradictions
        shell: bash
        run: |
          set -euo pipefail
          java -cp build/chemcore-next-p01 com.hazrob.tank.chemcore.next.EvidenceConflictGraphSmoke \
            | tee build/chemcore-next-p01/P05-CONFLICT-GRAPH.log
          grep -q '^CHEMCORE_NEXT_P05_3_CONFLICT_GRAPH_PASS ' \
            build/chemcore-next-p01/P05-CONFLICT-GRAPH.log
      - name: Verify P05.4-P05.7 hierarchical inference, no false ppm and inverse residual
        shell: bash
        run: |
          set -euo pipefail
          java -cp build/chemcore-next-p01 com.hazrob.tank.chemcore.next.NextP05InferenceSmoke \
            | tee build/chemcore-next-p01/P05-INFERENCE-SAFETY.log
          grep -q '^CHEMCORE_NEXT_P05_4_7_INFERENCE_PASS ' \
            build/chemcore-next-p01/P05-INFERENCE-SAFETY.log
      - name: P06.1 and P06.4 integrated real owner baseline G1 fail-closed and JVM resource profile
        shell: bash
        run: |
          set -euo pipefail
          java -cp build/chemcore-next-p01 com.hazrob.tank.chemcore.next.NextP06IntegratedCoreSmoke \
            build/chemcore-next-p01 | tee build/chemcore-next-p01/P06-G1-INTEGRATED.log
          grep -q '^CHEMCORE_NEXT_P06_1_4_INTEGRATED_G1_PASS ' \
            build/chemcore-next-p01/P06-G1-INTEGRATED.log
          python - <<'PY'
          import json,pathlib
          d=json.loads(pathlib.Path('build/chemcore-next-p01/p06_resource_profile.json').read_text())
          assert d['scenario']=='736_material_catalog_two_source_roots_research_only'
          assert d['measurements']==1500
          assert not d['benchmarks_android_device'] and not d['g3'] and not d['ppm_authorized']
          assert d['latency_p99_ms']>=d['latency_p95_ms']>=d['latency_median_ms']>=0
          print('CHEMCORE_NEXT_P06_1_4_RESOURCE_REPORT_PASS')
          PY
      - name: P06 integrated single-entrypoint ChemCoreNext source experts through source-root arbitration
        shell: bash
        run: |
          set -euo pipefail
          java -cp build/chemcore-next-p01 com.hazrob.tank.chemcore.next.ChemCoreNextOrchestratorSmoke \
            | tee build/chemcore-next-p01/P06-ORCHESTRATOR.log
          grep -q '^CHEMCORE_NEXT_P06_ORCHESTRATOR_PASS ' \
            build/chemcore-next-p01/P06-ORCHESTRATOR.log
      - name: P06 diverse source-trained MQ fingerprint bundles with concentration/source dedup
        shell: bash
        run: |
          set -euo pipefail
          java -cp build/chemcore-next-p01 com.hazrob.tank.chemcore.next.ResearchFingerprintBundleSmoke \
            | tee build/chemcore-next-p01/P06-DIVERSE-FINGERPRINT-BUNDLE.log
          grep -q '^CHEMCORE_NEXT_DIVERSE_BUNDLE_G1_PASS ' \
            build/chemcore-next-p01/P06-DIVERSE-FINGERPRINT-BUNDLE.log
      - name: Replay original Oct1 2026 ethanol plus smoke 8-MQ owner source and G1 source-curve divergence
        shell: bash
        run: |
          set -euo pipefail
          java -cp build/chemcore-next-p01 com.hazrob.tank.chemcore.next.NextOctoberEthanolReplaySmoke \
              research/chemcore_next/experiments/october_2026_ethanol_experiment4_8mq_recovered_rounded.csv \
              research/chemcore_next/experiments/october_2026_ethanol_experiment4_replay_provenance.json \
              build/chemcore-next-p01/OCT2026-ETHANOL-REPLAY.json \
              | tee build/chemcore-next-p01/OCT2026-ETHANOL-REPLAY.log
          grep -q '^CHEMCORE_NEXT_OCT2026_REAL_ETHANOL_REPLAY_PASS ' \
              build/chemcore-next-p01/OCT2026-ETHANOL-REPLAY.log
          python - <<'PY'
          import json,pathlib
          r=json.loads(pathlib.Path('build/chemcore-next-p01/OCT2026-ETHANOL-REPLAY.json').read_text())
          assert r['physical_October_MQ_channels']==8
          assert r['next_heater_filtered_6mq_candidates']==0
          assert r['alcohol_source_curves_outside_nominal_range']==6
          assert abs(r['source_MQ3_ethanol_equation_replay_ppm_math_only']-177.8473248739)<1e-5
          assert not r['G3_actual_Tank_gas_challenge']
          assert not r['historical_approx_118ppm_reproduced']
          print('CHEMCORE_NEXT_OCT2026_8MQ_G1_EVIDENCE_GATE_PASS')
          PY
      - name: Replay original Oct ethanol 8MQ with complete Next source-curve research portfolios and heater filtered 6MQ
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib
          source=pathlib.Path('android/app/src/main/assets/chemcore_v6/reference/mq_research_curves_43.json')
          d=json.loads(source.read_text())
          assert d['curve_count']==43 and len(d['curves'])==43
          assert d['source']['version']=='6.0.0'
          h=['sensor','legacy_id','gas_label','ratio_a','ratio_b','output_scale','min_ppm','max_ppm']
          dest=pathlib.Path('build/chemcore-next-p01/OCT2026-ORIGINAL-CURVES.tsv')
          dest.write_text('\t'.join(h)+'\n'+''.join('\t'.join(str(r[k]) for k in h)+'\n' for r in d['curves']))
          print('ORIGINAL_43_MQDATASCIENCE_SOURCE_CURVES_EXTRACTED')
          PY
          java -cp build/chemcore-next-p01 com.hazrob.tank.chemcore.next.NextOctoberEthanolSourcePortfolioDiagnostic \
              research/chemcore_next/experiments/october_2026_ethanol_experiment4_8mq_recovered_rounded.csv \
              build/chemcore-next-p01/OCT2026-ORIGINAL-CURVES.tsv \
              build/chemcore-next-p01/OCT2026-ETHANOL-PORTFOLIO-DIAGNOSTIC.json \
              | tee build/chemcore-next-p01/OCT2026-ETHANOL-PORTFOLIO-DIAGNOSTIC.log
          grep -q '^CHEMCORE_NEXT_OCT_ETHANOL_PORTFOLIO_DIAGNOSTIC_PASS ' \
              build/chemcore-next-p01/OCT2026-ETHANOL-PORTFOLIO-DIAGNOSTIC.log
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('build/chemcore-next-p01/OCT2026-ETHANOL-PORTFOLIO-DIAGNOSTIC.json')
          x=json.loads(p.read_text())
          a,b=x['source_experimental_arms']
          assert a['next_engine_decision']=='UNKNOWN' and b['next_engine_decision']=='UNKNOWN'
          assert a['engine_eligible_candidates']==b['engine_eligible_candidates']==0
          assert a['original_MQ_channels']==8 and b['original_MQ_channels']==6
          assert a['shadow_ranking_HYPOTHETICAL_R0_SOURCE_ONLY'][0]['legacy_id']==75
          assert not x['chemical_identity_confirmed'] and not x['gas_ppm_reportable']
          assert x['source_root_independence_count']==1
          print('CHEMCORE_NEXT_OCT2026_SOURCE_PORTFOLIO_G1_GATE_PASS')
          PY
      - name: P07.1 V8 immutable eight-MQ telemetry adapter, original R_air and missing-heater regression
        shell: bash
        run: |
          set -euo pipefail
          java -cp build/chemcore-next-p01 com.hazrob.tank.chemcore.next.NextTelemetryMapperSmoke \
             | tee build/chemcore-next-p01/P07-1-TELEMETRY-MAPPER.log
          grep -q '^CHEMCORE_NEXT_P07_1_TELEMETRY_MAPPER_PASS ' \
             build/chemcore-next-p01/P07-1-TELEMETRY-MAPPER.log
      - name: P07.3 source-of-truth routing, explicit V6 comparison only and no silent fallback
        shell: bash
        run: |
          set -euo pipefail
          java -cp build/chemcore-next-p01 com.hazrob.tank.chemcore.next.NextEngineRoutingPolicySmoke \
            | tee build/chemcore-next-p01/P07-3-ENGINE-ROUTING.log
          grep -q '^CHEMCORE_NEXT_P07_3_NO_SILENT_FALLBACK_PASS ' \
            build/chemcore-next-p01/P07-3-ENGINE-ROUTING.log
      - name: P07.4 immutable Next decision display parity 0-80 and tampering gates
        shell: bash
        run: |
          set -euo pipefail
          java -cp build/chemcore-next-p01 com.hazrob.tank.chemcore.next.NextDecisionPresentationSmoke \
            | tee build/chemcore-next-p01/P07-4-DECISION-PRESENTATION.log
          grep -q '^CHEMCORE_NEXT_P07_4_IMMUTABLE_DISPLAY_PASS ' \
            build/chemcore-next-p01/P07-4-DECISION-PRESENTATION.log
            build/chemcore-next-p01/P09-2-FIELD-RAW-ARCHIVE.log
      - name: P09.2 original 60 second source archive and independent MQ scan-cycle integrity
        shell: bash
        run: |
          set -euo pipefail
          java -cp build/chemcore-next-p01 com.hazrob.tank.chemcore.next.NextFieldArchiveSmoke \
            | tee build/chemcore-next-p01/P09-2-FIELD-RAW-ARCHIVE.log
          grep -q '^CHEMCORE_NEXT_P09_2_FIELD_RAW_ARCHIVE_PASS ' \
            build/chemcore-next-p01/P09-2-FIELD-RAW-ARCHIVE.log
      - name: Preserve source/test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChemCore-Next-P01-Core-Contract-Evidence
          path: |
            build/chemcore-next-p01/P01-CONTRACT-TEST.log
            build/chemcore-next-p01/P01-REPLAY-TEST.log
            build/chemcore-next-p01/P02-SIGNAL-PHYSICS-TEST.log
            build/chemcore-next-p01/P02-DUAL-R0-TEST.log
            build/chemcore-next-p01/P02-SENSOR-QUALITY-TEST.log
            build/chemcore-next-p01/P02-SINGLE-SENSOR-TEST.log
            build/chemcore-next-p01/P02-CLEAN-AIR-REPLAY-TEST.log
            build/chemcore-next-p01/NH3-NH4-SHARED-SOURCE-TEST.log
            build/chemcore-next-p01/P04-SOURCE-CURVE-EXPERT.log
            build/chemcore-next-p01/P04-FINGERPRINT-EXPERT.log
            build/chemcore-next-p01/P04-TEMPORAL-EXPERT.log
            build/chemcore-next-p01/P04-ENVIRONMENT-EXPERT.log
            build/chemcore-next-p01/P04-INDEPENDENT-ROOTS.log
            build/chemcore-next-p01/P05-CANDIDATE-GENERATOR.log
            build/chemcore-next-p01/P05-POLARITY-ROUTER.log
            build/chemcore-next-p01/OWNER-TANK-8MQ-AIR-BASELINE.log
            build/chemcore-next-p01/P05-CONFLICT-GRAPH.log
            build/chemcore-next-p01/P05-INFERENCE-SAFETY.log
            build/chemcore-next-p01/P06-G1-INTEGRATED.log
            build/chemcore-next-p01/p06_resource_profile.json
            build/chemcore-next-p01/P06-ORCHESTRATOR.log
            build/chemcore-next-p01/P06-DIVERSE-FINGERPRINT-BUNDLE.log
            build/chemcore-next-p01/OCT2026-ETHANOL-REPLAY.log
            build/chemcore-next-p01/OCT2026-ETHANOL-REPLAY.json
            build/chemcore-next-p01/OCT2026-ETHANOL-PORTFOLIO-DIAGNOSTIC.log
            build/chemcore-next-p01/OCT2026-ETHANOL-PORTFOLIO-DIAGNOSTIC.json
            build/chemcore-next-p01/P07-1-TELEMETRY-MAPPER.log
            build/chemcore-next-p01/P07-3-ENGINE-ROUTING.log
            build/chemcore-next-p01/P07-4-DECISION-PRESENTATION.log
          if-no-files-found: warn
          retention-days: 30
