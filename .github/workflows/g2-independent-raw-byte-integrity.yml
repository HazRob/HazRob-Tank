name: G2 independent raw-byte integrity regression
on:
  push:
    branches:
      - research/chemcore80-central-evidence-gap-analysis-20261021
    paths:
      - 'research/implementation_execution/verify_g2_raw_integrity.py'
      - 'research/implementation_execution/test_verify_g2_raw_integrity.py'
      - 'research/implementation_execution/g2_verify_raw_files.py'
      - 'research/implementation_execution/test_g2_verify_raw_files.py'
      - 'research/implementation_execution/test_g2_raw_path_controls.py'
      - 'research/implementation_execution/test_g2_date_digest_boundaries.py'
      - 'research/implementation_execution/test_g2_metadata_canonical.py'
      - 'research/implementation_execution/G2_INDEPENDENT_EVIDENCE.json'
      - '.github/workflows/g2-independent-raw-byte-integrity.yml'
  pull_request:
    paths:
      - 'research/implementation_execution/verify_g2_raw_integrity.py'
      - 'research/implementation_execution/test_verify_g2_raw_integrity.py'
      - 'research/implementation_execution/g2_verify_raw_files.py'
      - 'research/implementation_execution/test_g2_verify_raw_files.py'
      - 'research/implementation_execution/test_g2_raw_path_controls.py'
      - 'research/implementation_execution/test_g2_date_digest_boundaries.py'
      - 'research/implementation_execution/test_g2_metadata_canonical.py'
      - 'research/implementation_execution/G2_INDEPENDENT_EVIDENCE.json'
      - '.github/workflows/g2-independent-raw-byte-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  raw-byte-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run raw-byte integrity regression suite (not scientific validation)
        run: python -m unittest discover -s research/implementation_execution -p 'test_verify_g2_raw_integrity.py' -v
      - name: Run independent physical raw-file path and hash regression suite
        run: python -m unittest discover -s research/implementation_execution -p 'test_g2_verify_raw_files.py' -v
      - name: Run control-character raw-path regression (not scientific validation)
        run: python -m unittest discover -s research/implementation_execution -p 'test_g2_raw_path_controls.py' -v
      - name: Run calendar-date and digest-boundary provenance regressions
        run: python -m unittest discover -s research/implementation_execution -p 'test_g2_date_digest_boundaries.py' -v
      - name: Run strict JSON and metadata canonicalization regression
        run: python -m unittest discover -s research/implementation_execution -p 'test_g2_metadata_canonical.py' -v
      - name: Check checked-in evidence registry against physical raw-file integrity gate
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          manifest = pathlib.Path("research/implementation_execution/G2_INDEPENDENT_EVIDENCE.json")
          result = subprocess.run(
              [sys.executable, "research/implementation_execution/g2_verify_raw_files.py",
               str(manifest), "research/implementation_execution"],
              capture_output=True, text=True, check=False
          )
          registry = json.loads(manifest.read_text(encoding="utf-8"))
          records = registry.get("records")
          if records == []:
              assert result.returncode == 2, (
                  f"Expected fail-closed exit 2 for empty evidence; "
                  f"got {result.returncode}: {result.stdout} {result.stderr}"
              )
              assert "no independent physical records (BLOCKED)" in result.stderr, result.stderr
              print("Independent evidence registry remains BLOCKED; no scientific qualification.")
          else:
              assert result.returncode == 0, (
                  f"Nonempty registry failed raw-byte integrity preflight: "
                  f"{result.returncode}: {result.stdout} {result.stderr}"
              )
              assert "scientifically_validated=false" in result.stdout, result.stdout
              print("Raw-byte integrity preflight passed; independent scientific qualification NOT established.")
          PY
      - name: Check empty independent-evidence registry remains blocked
        run: |
          python - <<'PY'
          import json,sys
          sys.path.insert(0, "research/implementation_execution")
          from verify_g2_raw_integrity import verify
          result = verify({"records":[]}, ".")
          assert result["status"] == "BLOCKED"
          assert result["scientifically_validated"] is False
          print(json.dumps(result, sort_keys=True))
          PY
