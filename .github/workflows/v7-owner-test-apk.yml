name: HazRob Tank V7 owner-requested TEST APK (Excel-only app patch)

# Owner requested a V7 test APK: only functional change relative to V6 app
# is SmartFieldSessionXlsxWriter. Build-only version/identity/stable changes
# are made in an isolated checkout, not pushed to Android sources.
on:
  push:
    branches: [feature/tank-v7-reports]
    paths:
      - '.github/workflows/v7-owner-test-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v7-xlsx-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout Tank V7
        uses: actions/checkout@v4
        with:
          path: tank
      - name: Checkout frozen Android base (read-only)
        uses: actions/checkout@v4
        with:
          repository: sohpany/SERVOC-Android
          ref: 6281d3eb7c1c961ce63b0b5e4ae0792874626720
          token: ${{ secrets.HAZROB_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
      - name: Overlay Tank Android and set V7 test identity only in disposable build
        shell: bash
        run: |
          set -euo pipefail
          cp -a tank/android/app/src/main/java/. source/app/src/main/java/
          if test -d tank/android/app/src/main/res; then cp -a tank/android/app/src/main/res/. source/app/src/main/res/; fi
          if test -d tank/android/app/src/main/assets; then mkdir -p source/app/src/main/assets; cp -a tank/android/app/src/main/assets/. source/app/src/main/assets/; fi
          if test -d tank/android/app/src/test/java; then mkdir -p source/app/src/test/java; cp -a tank/android/app/src/test/java/. source/app/src/test/java/; fi
          mkdir -p source/tools
          cp tank/tools/prepare_v7_stable_source.py source/tools/prepare_v7_stable_source.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          gradle=Path('source/app/build.gradle')
          s=gradle.read_text()
          for old,new in (
              ("applicationId 'com.servoc.app'","applicationId 'com.hazrob.tank'"),
              ("versionName '0.10.2'","versionName '7.0'"),
              ("versionCode 30","versionCode 7"),
              ("debug { signingConfig signingConfigs.prototype }","debug { }")):
              assert old in s,'Pinned Android build source mismatch: '+old
              s=s.replace(old,new,1)
          stable='https://raw.githubusercontent.com/HazRob/HazRob-Tank/main/updates/chemcore-stable/manifest.json'
          key="buildConfigField 'String', 'CHEMCORE_LIBRARY_MANIFEST_URL', "
          original=key+"'"+chr(34)*2+"'"
          assert original in s
          s=s.replace(original,key+"'"+chr(34)+stable+chr(34)+"'",1)
          gradle.write_text(s)
          manifest=Path('source/app/src/main/AndroidManifest.xml')
          manifest.write_text(re.sub(r'android:label="[^"]*"','android:label="HazRob Tank"',manifest.read_text(),count=1))
          release=Path('source/app/src/main/java/com/servoc/app/ReleaseAudit.java')
          t=release.read_text()
          assert 'VERSION="6.0"' in t and 'DATABASE_SCHEMA=14' in t
          t=t.replace('VERSION="6.0"','VERSION="7.0"',1)
          t=t.replace('ENGINEERING_REVISION="TANK-V6-CHEMCORE-V14-180WARM-60SAMPLE-DEV"',
                      'ENGINEERING_REVISION="TANK-V7-XLSX-TEST-ESP32-V6-CHEMCORE-V6"',1)
          release.write_text(t)
          PY
          python3 source/tools/prepare_v7_stable_source.py source
      - name: Stage verified offline Stable 1.0.0-hr069r1 for app 7.0
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          python3 tools/build_hr069_embedded_stable.py --out-dir app/build/generated/hazrobAssets/generated/chemcore/embedded_stable
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          d=Path('app/build/generated/hazrobAssets/generated/chemcore/embedded_stable')
          m=json.loads((d/'manifest.json').read_text())
          data=(d/m['payload_file']).read_bytes()
          assert m['min_app_version']==m['max_app_version']=='7.0'
          assert m['chemical_count']==652 and m['calibration_count']==0
          assert m['payload_sha256']==hashlib.sha256(data).hexdigest()
          print('V7 Stable compatibility manifest 7.0 with unchanged research payload SHA',m['payload_sha256'])
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Compile and test only the Excel report functional patch
        working-directory: source
        run: |
          gradle --no-daemon :app:compileDebugJavaWithJavac
          gradle --no-daemon :app:testDebugUnitTest --tests com.servoc.app.report.TankV7AdsRawExportContractTest
      - name: Build Android V7 TEST APK
        working-directory: source
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify test APK contains Stable content and package identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,hashlib,json,os
          apk=Path('source/app/build/outputs/apk/debug/app-debug.apk')
          assert apk.is_file() and apk.stat().st_size>1000000
          with zipfile.ZipFile(apk) as z:
              prefix='assets/generated/chemcore/embedded_stable/'
              m=json.loads(z.read(prefix+'manifest.json'))
              payload=z.read(prefix+m['payload_file'])
              assert m['min_app_version']==m['max_app_version']=='7.0'
              assert m['chemical_count']==652 and m['calibration_count']==0
              assert hashlib.sha256(payload).hexdigest()==m['payload_sha256']
          dest=Path('v7-test-apk');dest.mkdir(exist_ok=True)
          out=dest/'HazRob-Tank-V7-Excel-TEST.apk'
          out.write_bytes(apk.read_bytes())
          (dest/'SHA256SUMS.txt').write_text(hashlib.sha256(out.read_bytes()).hexdigest()+'  '+out.name+'\n')
          (dest/'BUILD-NOTE.txt').write_text(
              'HazRob Tank V7 Excel TEST Android application\n'
              'Repo SHA: '+os.environ['GITHUB_SHA']+'\n'
              'Android package: com.hazrob.tank, versionName 7.0 / versionCode 7\n'
              'ESP32 Tank firmware: V6 API4 unchanged. ChemCore remains V6; no V8 gas experiments.\n'
              'ONLY functional V7 app patch relative to V6: SmartFieldSessionXlsxWriter.\n'
              'Contains verified Stable snapshot with 652 identities, 49 research priors, zero calibrations.\n'
              'DEBUG/TEST SIGNATURE; not guaranteed compatible with installed app signing.\n'
              'DO NOT UNINSTALL existing app or erase previous sessions.\n'
              'No G3 safety or ppm claims.\n'
          )
          print('V7 Excel TEST APK size',out.stat().st_size)
          PY
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs v7-test-apk/HazRob-Tank-V7-Excel-TEST.apk
      - name: Upload V7 TEST APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: HazRob-Tank-V7-Excel-TEST-APK
          path: v7-test-apk/
          retention-days: 30
          if-no-files-found: error
