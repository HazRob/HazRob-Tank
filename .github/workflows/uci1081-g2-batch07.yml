name: HazRob Tank G2-07 heldout classifiers and uncertainty
on:
  push:
    paths:
      - '.github/workflows/uci1081-g2-batch07.yml'
      - 'research/benchmarks/*batch07*'
      - 'research/techniques/06.4/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g2-07:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exposure splitting and conformal regression
        run: |
          python -m unittest discover -s research/benchmarks -p 'test_uci1081_g2_batch07_v1.py' -v
          python -m unittest discover -s research/techniques/06.4 -p 'test*.py' -v
      - name: Download original source
        run: |
          curl --fail --location --retry 3 --max-time 180 'https://archive.ics.uci.edu/static/public/1081/gas%2Bsensor%2Barray%2Blow-concentration.zip' -o uci1081_original.zip
          echo '813ebb7d00ed9172114b68d27ab3213170d6c220b8b23907dce91e9838cd48ab  uci1081_original.zip' | sha256sum --check
      - name: Evaluate ten research techniques
        run: python research/benchmarks/uci1081_g2_batch07_v1.py uci1081_original.zip --output g2_batch07.json
      - uses: actions/upload-artifact@v4
        with:
          name: g2-batch07-evidence
          path: g2_batch07.json
          if-no-files-found: error
          retention-days: 90
