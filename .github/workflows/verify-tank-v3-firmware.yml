name: Verify HazRob Tank V3 ESP32 Firmware

on:
  workflow_dispatch:
  push:
    branches: [feature/tank-v3-implementation]
    paths:
      - 'firmware/ESP32-Tank/**'
      - '.github/workflows/verify-tank-v3-firmware.yml'

permissions:
  contents: read

jobs:
  build-esp32-tank:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Assert operator-only motion safety contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          config=Path('firmware/ESP32-Tank/Config.h').read_text()
          src=Path('firmware/ESP32-Tank/Hardware.cpp').read_text()
          ino=Path('firmware/ESP32-Tank/ESP32-Tank.ino').read_text()
          assert 'CONTROL_COMMAND_TIMEOUT_MS=500' in config
          assert 'if(transportLost || now-cmdAt>Cfg::CONTROL_COMMAND_TIMEOUT_MS)' in src
          assert 'motionStopImmediate();' in src
          assert 'RecoveryPhase::REPLAY' not in src
          assert 'RECOVERY_SPEED_PERCENT' not in src
          assert 'void linkSetArmed(bool a)' in src and 'motionStopImmediate();staleStop=true' in src
          assert 'web.on("/estop"' in ino and 'safetyLatchEstop();emergencyStop();' in ino
          print('PASS: source-level safety policy: 500ms watchdog, neutral stop, no autonomous reverse playback')
          PY

      - uses: arduino/setup-arduino-cli@v2

      - name: Install pinned Arduino-ESP32 2.x board core
        run: |
          set -euo pipefail
          INDEX=https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index --additional-urls "$INDEX"
          arduino-cli core install esp32:esp32@2.0.17 --additional-urls "$INDEX"

      - name: Compile ESP32 Tank source (DOIT ESP32 DevKit V1)
        run: |
          set -euo pipefail
          arduino-cli compile --warnings all --fqbn esp32:esp32:esp32 --output-dir firmware-build firmware/ESP32-Tank

      - name: Package UNRELEASED V3 test firmware and Arduino sources
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,zipfile
          root=Path('firmware/ESP32-Tank')
          builds=Path('firmware-build')
          fw=sorted(builds.glob('*.bin'))
          if not fw: raise SystemExit('No ESP32 binary produced by compiler')
          dst=Path('unreleased-firmware')
          dst.mkdir(exist_ok=True)
          bundle=dst/'HazRob-ESP32-Tank-V3-UNRELEASED-Arduino.zip'
          with zipfile.ZipFile(bundle,'w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(root.iterdir()):
                  if p.is_file() and p.suffix.lower() in ('.ino','.cpp','.h','.md'):
                      z.write(p,arcname=f'ESP32-Tank/{p.name}')
          for p in fw:
              (dst/p.name).write_bytes(p.read_bytes())
          manifest=dst/'SHA256SUMS.txt'
          manifest.write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in sorted(dst.iterdir()) if p.is_file() and p.name!='SHA256SUMS.txt'))
          print('UNRELEASED candidate artifacts:',[p.name for p in dst.iterdir()])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: HazRob-ESP32-Tank-V3-UNRELEASED-firmware-candidate
          path: unreleased-firmware/
          if-no-files-found: error
          retention-days: 14

      - name: Firmware compile checkpoint
        run: |
          echo 'Source-only V3 firmware build validated. No ESP32 flash or physical safety test performed.'
