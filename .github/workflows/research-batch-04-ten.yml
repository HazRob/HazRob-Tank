name: HazRob Tank batch 04 — ten technique unit gates
on:
  push:
    paths:
      - '.github/workflows/research-batch-04-ten.yml'
      - 'research/techniques/04.8/**'
      - 'research/techniques/04.9/**'
      - 'research/techniques/04.10/**'
      - 'research/techniques/05.1/**'
      - 'research/techniques/05.2/**'
      - 'research/techniques/05.3/**'
      - 'research/techniques/05.4/**'
      - 'research/techniques/05.5/**'
      - 'research/techniques/05.6/**'
      - 'research/techniques/05.7/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-gate:
    name: unit gate ${{ matrix.technique }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        technique: ['04.8', '04.9', '04.10', '05.1', '05.2', '05.3', '05.4', '05.5', '05.6', '05.7']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research test dependencies
        run: python -m pip install numpy
      - name: Compile and run isolated technique tests
        working-directory: research/techniques/${{ matrix.technique }}
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q .
          python -m unittest discover -v -p 'test_*.py' 2>&1 | tee "$RUNNER_TEMP/unittest.log"
          if ! grep -Eq '^Ran [1-9][0-9]* tests?' "$RUNNER_TEMP/unittest.log"; then
            echo 'ERROR: No verifiable tests executed' >&2
            exit 1
          fi
          echo "## ${{ matrix.technique }} unit test results" >> "$GITHUB_STEP_SUMMARY"
          grep -E '^Ran [0-9]+ tests?|^OK$|^FAILED' "$RUNNER_TEMP/unittest.log" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batch04-${{ matrix.technique }}-unit-log
          path: ${{ runner.temp }}/unittest.log
          if-no-files-found: warn
          retention-days: 90
