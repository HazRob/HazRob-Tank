name: ChemCore V6 Android one-shot clean air R0 actual engine/report check
on:
  push:
    branches: [feature/tank-v6-implementation]
    paths:
      - 'research/chemcore_v6/tests/android/V6CleanAirInstantFixtureActivity.java'
      - 'android/app/src/main/java/com/hazrob/tank/chemcore/v6/CleanAirResponseGateV6.java'
      - 'android/app/src/main/java/com/hazrob/tank/v6integration/TankV6TelemetryAdapter.java'
      - 'android/app/src/main/java/com/servoc/app/chemcore/TankInstantAnalyzer.java'
      - 'research/chemcore_v6/tests/android/run_v6_clean_air_instant.sh'
      - '.github/workflows/chemcore-v6-clean-air-instant-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-instant-clean-air-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: tank
      - uses: actions/checkout@v4
        with:
          repository: sohpany/SERVOC-Android
          ref: 6281d3eb7c1c961ce63b0b5e4ae0792874626720
          token: ${{ secrets.HAZROB_SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - name: Overlay Tank Android source and temporary clean air fixture
        shell: bash
        run: |
          set -euo pipefail
          cp -a tank/android/app/src/main/java/. source/app/src/main/java/
          if test -d tank/android/app/src/main/res; then cp -a tank/android/app/src/main/res/. source/app/src/main/res/; fi
          cp tank/research/chemcore_v6/tests/android/V6CleanAirInstantFixtureActivity.java \
            source/app/src/main/java/com/servoc/app/report/V6CleanAirInstantFixtureActivity.java
          python3 - <<'PY'
          from pathlib import Path
          p=Path('source/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          needle='<activity android:name=".MainActivity" android:exported="false"/>'
          assert needle in s
          s=s.replace(needle,'<activity android:name=".report.V6CleanAirInstantFixtureActivity" android:exported="true"/>\n        '+needle)
          p.write_text(s)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK setup
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Ephemeral emulator-only signature
        run: |
          mkdir -p source/signing
          keytool -genkeypair -alias hazrob-prototype -keystore source/signing/hazrob-prototype.jks \
            -storepass hazrob-prototype -keypass hazrob-prototype -keyalg RSA -keysize 2048 \
            -validity 1 -dname "CN=CI ONLY, OU=NO RELEASE, O=HazRob" -noprompt
      - name: Compile temporary Android test APK
        working-directory: source
        run: gradle --no-daemon :app:assembleDebug
      - name: Enable KVM
        run: if test -c /dev/kvm; then sudo chmod a+rw /dev/kvm; fi
      - name: Exercise actual V6 one-shot analyzer plus PDF on Android emulator API31
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          script: bash tank/research/chemcore_v6/tests/android/run_v6_clean_air_instant.sh
      - name: Verify PDF says UNKNOWN and no reportable ppm
        run: |
          python3 -m pip install --disable-pip-version-check --quiet PyMuPDF==1.26.7
          python3 - <<'PY'
          import fitz, json
          from pathlib import Path
          p=Path('/tmp/v6-clean-air-instant')
          d=json.loads((p/'v6_clean_air_instant_result.json').read_text())
          assert d['reported_identity']=='UNKNOWN' and d['ppm_reportable'] is False
          assert len(d['source_curve_hypotheses'])==0
          assert len(d['source_curve_research_diagnostic_ledger'])==49
          assert d['gas_response_screening_state']=='WITHIN_CLEAN_AIR_REFERENCE_BAND'
          assert d['gas_alerts']==[]
          pdf=fitz.open(str(p/'v6_clean_air_instant.pdf'))
          assert pdf.page_count==1
          s=pdf[0].get_text()
          assert 'UNKNOWN' in s
          assert 'ChemCore V6' in s
          assert '0' in s
          print('PASS Android API31: visible UNKNOWN / 49 non-certified curves, 1 page PDF')
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ChemCore-V6-Clean-Air-Instant-Android12-Report
          path: /tmp/v6-clean-air-instant/
          retention-days: 30
