name: ChemCore V6 V13 exact source schema migration regression

on:
  push:
    branches: [feature/tank-v6-implementation]
    paths:
      - 'android/app/src/main/java/com/servoc/app/data/ExperimentsDb.java'
      - 'research/chemcore_v6/tests/test_v13_unified_hazard_migration.py'
      - '.github/workflows/chemcore-v6-n09-v13-migration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v12-to-v13-exact-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute exact Java V13 SQLite SQL on preserved V12 field and experiment fixture
        run: |
          python3 -m unittest -v research/chemcore_v6/tests/test_v13_unified_hazard_migration.py
