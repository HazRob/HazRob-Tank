name: ChemCore V6 N09 scientific exposure threshold policy

on:
  push:
    branches: [feature/tank-v6-implementation]
    paths:
      - 'android/app/src/main/java/com/hazrob/tank/chemcore/v6/V6ScientificThresholdPolicy.java'
      - 'research/chemcore_v6/tests/java/V6ScientificThresholdPolicyTest.java'
      - '.github/workflows/chemcore-v6-n09-scientific-risk-policy-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arithmetic-reference-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile pure-Java scientific threshold logic
        run: |
          set -euo pipefail
          mkdir -p /tmp/v6-threshold
          javac -d /tmp/v6-threshold \
            android/app/src/main/java/com/hazrob/tank/chemcore/v6/V6ScientificThresholdPolicy.java \
            research/chemcore_v6/tests/java/V6ScientificThresholdPolicyTest.java
          java -cp /tmp/v6-threshold com.hazrob.tank.chemcore.v6.V6ScientificThresholdPolicyTest
