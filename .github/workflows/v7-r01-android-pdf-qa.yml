name: HazRob Tank V7 R01+R02+R03 Geometry Android PDF QA (non-release)
on:
  push:
    branches: [feature/tank-v7-reports]
    paths:
      - 'android/app/src/main/java/com/servoc/app/report/TankInstantReportPdf.java'
      - 'android/app/src/main/java/com/servoc/app/report/TankInstantV7PdfWriter.java'
      - 'android/app/src/main/java/com/servoc/app/report/V7ReportLayoutKit.java'
      - 'android/app/src/main/java/com/servoc/app/report/V7ReportPagePlanner.java'
      - 'android/app/src/main/java/com/servoc/app/report/V7PhysicalReportPdfWriter.java'
      - 'android/app/src/main/java/com/hazrob/tank/foodfreshness/meat/V7BeefResearchPdfWriter.java'
      - 'android/app/src/main/java/com/hazrob/tank/foodfreshness/meat/BeefResearchPdf.java'
      - 'android/app/src/main/java/com/hazrob/tank/foodfreshness/V7FruitReportPdfWriter.java'
      - 'android/app/src/main/java/com/servoc/app/report/V7PhysicalIcons.java'
      - 'android/app/src/main/java/com/servoc/app/report/V7FieldChartLayout.java'
      - 'android/app/src/main/java/com/servoc/app/report/V7FieldReportSourceSnapshot.java'
      - 'android/app/src/main/java/com/servoc/app/report/TankPhysicalSnapshotPdf.java'
      - 'android/app/src/main/res/drawable/hazrob_official_report_mark.xml'
      - 'android/app/src/main/java/com/servoc/app/MainActivity.java'
      - 'research/chemcore_v6/tests/android/V7R01PdfFixtureActivity.java'
      - '.github/workflows/v7-r01-android-pdf-qa.yml'
      - 'research/chemcore_v6/tests/android/run_v7_r01_pdf_qa.sh'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-v7-r01-original-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: tank
      - uses: actions/checkout@v4
        with:
          repository: sohpany/SERVOC-Android
          ref: 6281d3eb7c1c961ce63b0b5e4ae0792874626720
          token: ${{ secrets.HAZROB_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
      - name: Overlay V7 production source and attach test-only fixture
        shell: bash
        run: |
          set -euo pipefail
          cp -a tank/android/app/src/main/java/. source/app/src/main/java/
          cp -a tank/android/app/src/main/res/. source/app/src/main/res/
          cp tank/research/chemcore_v6/tests/android/V7R01PdfFixtureActivity.java source/app/src/main/java/com/servoc/app/report/
          python3 - <<'PY'
          from pathlib import Path
          p=Path('source/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          marker='<activity android:name=".MainActivity" android:exported="false"/>'
          assert marker in s
          s=s.replace(marker,'<activity android:name=".report.V7R01PdfFixtureActivity" android:exported="true"/>\n        '+marker)
          p.write_text(s)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Disposable test signing
        shell: bash
        run: |
          mkdir -p source/signing
          keytool -genkeypair -alias hazrob-prototype -keystore source/signing/hazrob-prototype.jks -storepass hazrob-prototype -keypass hazrob-prototype -keyalg RSA -keysize 2048 -validity 1 -dname "CN=V7 R01 TEMP QA,OU=Disposable,O=HazRob" -noprompt
      - name: Build test-only Android APK (not release)
        working-directory: source
        run: gradle --no-daemon :app:assembleDebug
      - name: Enable KVM
        run: 'if test -c /dev/kvm; then sudo chmod a+rw /dev/kvm; fi'
      - name: Render original R01 using real Android PDF writer
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          script: bash tank/research/chemcore_v6/tests/android/run_v7_r01_pdf_qa.sh
      - name: QA A4 PDF, font sizes, logo and contrast on actual Android pages
        shell: bash
        run: |
          python3 -m pip install --quiet pymupdf pillow
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, fitz
          from PIL import Image
          p=Path('/tmp/v7-r01-pdf/HazRob_Tank_V7_R01_Actual_Android_Report.pdf')
          assert p.read_bytes().startswith(b'%PDF-') and p.stat().st_size>5000
          pdf=fitz.open(p)
          assert len(pdf)>=1
          data=[]
          for i,page in enumerate(pdf):
              assert abs(page.rect.width-595)<1 and abs(page.rect.height-842)<1,page.rect
              sizes=[span['size'] for block in page.get_text('dict')['blocks'] if 'lines' in block
                       for line in block['lines'] for span in line['spans'] if span.get('text','').strip()]
              assert sizes and min(sizes)>=11.5,(i,sizes)
              pix=page.get_pixmap(matrix=fitz.Matrix(2,2),alpha=False)
              dest=p.parent/f'V7_R01_Page_{i+1:02d}.png';pix.save(dest)
              im=Image.open(dest).convert('RGB')
              # Verify black header and owner amber colored emblem/palette on actual PDF.
              header=im.crop((28,28,1162,166))
              pixels=list(header.getdata())
              dark=sum(1 for r,g,b in pixels if r<35 and g<35 and b<35)
              amber=sum(1 for r,g,b in pixels if r>180 and 120<g<225 and b<55)
              assert dark>12000,(i,dark)
              assert amber>200,(i,amber)
              data.append(dict(page=i+1,font_min_pt=min(sizes),font_max_pt=max(sizes),dark_pixels=dark,amber_pixels=amber,
                               image=dest.name))
          kit_path=p.parent/'V7_Blank_Layout_Kit_Actual_Android.pdf'
          assert kit_path.is_file() and kit_path.stat().st_size>4000
          kit=fitz.open(kit_path)
          assert len(kit)==2,len(kit)
          assert abs(kit[0].rect.width-595)<1 and abs(kit[0].rect.height-842)<1
          assert abs(kit[1].rect.width-842)<1 and abs(kit[1].rect.height-595)<1
          for i,page in enumerate(kit):
              spans=[sp for block in page.get_text('dict')['blocks'] if 'lines' in block
                     for line in block['lines'] for sp in line['spans'] if sp['text'].strip()]
              assert spans,(i,'empty')
              assert min(sp['size'] for sp in spans)>=11.5,(i,min(sp['size'] for sp in spans))
              assert '-' in page.get_text(),(i,'missing placeholder')
              pic=page.get_pixmap(matrix=fitz.Matrix(1.5,1.5),alpha=False)
              pic.save(p.parent/f'V7_Blank_Kit_Android_Page_{i+1:02d}.png')
          kit_qa={'pages':len(kit),'page_formats':['A4 portrait','A4 landscape'],
                  'data':'blank placeholders only','font_min_pt':min(
                     sp['size'] for page in kit for block in page.get_text('dict')['blocks']
                     if 'lines' in block for line in block['lines']
                     for sp in line['spans'] if sp.get('text','').strip())}
          (p.parent/'blank_layout_kit_qa.json').write_text(json.dumps(kit_qa,indent=2))
          r02file=p.parent/'V7_R02_Actual_Android_Report.pdf'
          assert r02file.is_file() and r02file.stat().st_size>5000
          physical=fitz.open(r02file)
          assert len(physical)>=2,('dynamic-page count',len(physical))
          fulltext=' '.join(' '.join(page.get_text().split()) for page in physical)
          expected=['Temperature','Humidity','Pressure','Illuminance',
                    'Luminous Flux','Noise','Vibration','Ionizing Radiation',
                    'UV Index','PM1','PM2.5','PM10','Wind Speed',
                    'Wind Direction','Altitude']
          for name in expected:
              assert name in fulltext,('R02 missing indicator',name)
          r02_pages=[]
          for i,page in enumerate(physical):
              assert abs(page.rect.width-595)<1 and abs(page.rect.height-842)<1
              spans=[sp for block in page.get_text('dict')['blocks'] if 'lines' in block
                     for line in block['lines'] for sp in line['spans'] if sp.get('text','').strip()]
              assert spans,('R02 blank page',i)
              minpt=min(sp['size'] for sp in spans)
              assert minpt>=11.5,('R02 text smaller than 12pt',i,minpt)
              pix=page.get_pixmap(matrix=fitz.Matrix(1.5,1.5),alpha=False)
              dest=p.parent/f'V7_R02_Page_{i+1:02d}.png'
              pix.save(dest)
              r02_pages.append({'page':i+1,'min_font_pt':minpt,'image':dest.name})
          # Data is a synthetic QA fixture. No PM measurements or altitude
          # are part of its frozen source, and PDF may not manufacture them.
          assert fulltext.count('-')>=8,('R02 absent inputs not preserved')
          r02manifest={'format':'hazrob-v7-r02-original-android-pdf-qa/1',
                       'pages':r02_pages,'indicators_found':expected,
                       'sha256':hashlib.sha256(r02file.read_bytes()).hexdigest(),
                       'source':'Production TankPhysicalSnapshotPdf adapter + V7PhysicalReportPdfWriter',
                       'data':'Synthetic test fixture; not a Tank exposure assessment',
                       'scientific_claim':'No recalculated altitude, heat, PM or exposure limits'}
          (p.parent/'r02_manifest.json').write_text(json.dumps(r02manifest,indent=2))
          # R05 candidate is NOT production-wired until 18 licensed reference
          # photographs are bundled. Validate layout and source integrity only.
          fruit_path=p.parent/'V7_R05_Fruit_18_Families_No_Photos_Yet.pdf'
          fruit_blank_path=p.parent/'V7_R05_Fruit_No_Data_18_Families.pdf'
          assert fruit_path.is_file() and fruit_blank_path.is_file()
          selected_pdf=fitz.open(fruit_path)
          absent_pdf=fitz.open(fruit_blank_path)
          assert len(selected_pdf)>=3,('R05 18-item matrix + source details',len(selected_pdf))
          assert len(absent_pdf)==2,('R05 no-sample two-page matrix',len(absent_pdf))
          ftext=' '.join(' '.join(pg.get_text().split()) for pg in selected_pdf)
          blank_text=' '.join(' '.join(pg.get_text().split()) for pg in absent_pdf)
          for family in ['banana','blueberry','grape','green apple','kiwi',
                         'mandarin','pear','red apple','strawberry','tomato',
                         'applebanana','applebananamandarin','applebananatomato',
                         'applemandarin','appletomato','bananamandarin',
                         'tomatobanana','tomatomandarin']:
              assert family in ftext,('Missing selectable R05 food family',family)
              assert family in blank_text,('Missing blank-mode R05 family',family)
          for report in [selected_pdf,absent_pdf]:
              for i,pg in enumerate(report):
                  assert abs(pg.rect.width-595)<1 and abs(pg.rect.height-842)<1
                  spans=[sp for b in pg.get_text('dict')['blocks'] if 'lines' in b
                         for ln in b['lines'] for sp in ln['spans']
                         if sp.get('text','').strip()]
                  assert spans,(i,'empty R05 page')
                  assert min(sp['size'] for sp in spans)>=11.5,(i,'font under 12pt')
                  pg.get_pixmap(matrix=fitz.Matrix(1.5,1.5),alpha=False).save(
                      p.parent/f'V7_R05_{len(report)}pages_Page_{i+1:02d}.png')
          fruit_manifest={'format':'hazrob-v7-r05-layout-qa/1',
                          'selected_pages':len(selected_pdf),
                          'no_data_pages':len(absent_pdf),
                          'families_present':18,
                          'photo_assets_bundled':False,
                          'production_entrypoint_integrated':False,
                          'source':'Android V7FruitReportPdfWriter, not final fruit facade',
                          'input':'Synthetic source fixture / empty readings'}
          (p.parent/'r05_layout_manifest.json').write_text(json.dumps(fruit_manifest,indent=2))
          r06path=p.parent/'V7_R06_Actual_Android_Report.pdf'
          assert r06path.is_file() and r06path.stat().st_size>5000
          beef_pdf=fitz.open(r06path)
          assert len(beef_pdf)>=3,('R06 research pages',len(beef_pdf))
          beef_text=' '.join(' '.join(page.get_text().split()) for page in beef_pdf)
          for label in ['MQ2','MQ3','MQ4','MQ5','MQ8','MQ9','MQ135',
                        'excellent','good','acceptable','spoiled',
                        '10.17632/mwmhh766fc.3','10.1016/j.dib.2018.11.091',
                        '43.9','38.9','TS5','36h']:
              assert label in beef_text,('R06 source label missing',label)
          beef_pages=[]
          for i,page in enumerate(beef_pdf):
              assert abs(page.rect.width-595)<1 and abs(page.rect.height-842)<1
              spans=[sp for block in page.get_text('dict')['blocks']
                     if 'lines' in block for line in block['lines']
                     for sp in line['spans'] if sp.get('text','').strip()]
              assert spans,('empty R06 page',i)
              minpt=min(sp['size'] for sp in spans)
              assert minpt>=11.5,('small R06 text',i,minpt)
              image=page.get_pixmap(matrix=fitz.Matrix(1.5,1.5),alpha=False)
              pic=p.parent/f'V7_R06_Page_{i+1:02d}.png';image.save(pic)
              beef_pages.append({'page':i+1,'min_font_pt':minpt,'image':pic.name})
          assert '317' in beef_text and '540' in beef_text and '359' in beef_text
          beef_manifest={'format':'hazrob-v7-r06-original-android-pdf-qa/1',
                         'pages':beef_pages,
                         'sha256':hashlib.sha256(r06path.read_bytes()).hexdigest(),
                         'source':'Real BeefResearchPdf.save MediaStore facade -> V7BeefResearchPdfWriter',
                         'study_confusion':'Published external TS5 source-derived, NOT Tank TVC',
                         'input':'Explicit synthetic CI fixture, not physical meat sample'}
          (p.parent/'r06_manifest.json').write_text(json.dumps(beef_manifest,indent=2))
          r03path=p.parent/'V7_R03_Blank_Layout_Actual_Android.pdf'
          assert r03path.is_file() and r03path.stat().st_size>4000
          r03=fitz.open(r03path)
          assert len(r03)==3,('R03 native layout page count',len(r03))
          all_r03=' '.join(pg.get_text() for pg in r03)
          for token in ['R0/Rs','3D/4D','PPM','Candidate']:
              assert token in all_r03,('R03 geometry missing',token)
          r03pages=[]
          for i,page in enumerate(r03):
              assert abs(page.rect.width-842)<1 and abs(page.rect.height-595)<1
              spans=[sp for block in page.get_text('dict')['blocks'] if 'lines' in block
                     for line in block['lines'] for sp in line['spans']
                     if sp.get('text','').strip()]
              assert spans
              minpt=min(sp['size'] for sp in spans)
              assert minpt>=11.5,('R03 chart label font too small',i,minpt)
              page.get_pixmap(matrix=fitz.Matrix(1.6,1.6),alpha=False).save(
                  p.parent/f'V7_R03_Layout_Page_{i+1:02d}.png')
              r03pages.append({'page':i+1,'min_font_pt':minpt})
          (p.parent/'r03_geometry_qa.json').write_text(json.dumps({
              'stage':'geometry-only, NOT production R03',
              'pages':r03pages,
              'sha256':hashlib.sha256(r03path.read_bytes()).hexdigest(),
              'forms':'four equal 2x2 chart slots, dedicated 3D/4D/compensation, PPM blank micro slot',
              'data':'none',
              'scientific_claim':'no chemical identity, ppm, or sensor measurement'
          },indent=2))
          status=json.loads((p.parent/'status.json').read_text())
          assert status['scientific_status']=='UNKNOWN_G3_ZERO_NO_CERTIFIED_PPM'
          manifest={'format':'hazrob-v7-r01-original-android-pdf-qa/1','pages':data,
                    'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
                    'source':'Android production PDF writer from V7 branch, not manually recreated',
                    'input':'Synthetic MQ values, not physical Tank evidence',
                    'scientific_claim':'None; G3=0, not certified ppm'}
          (p.parent/'manifest.json').write_text(json.dumps(manifest,indent=2))
          print(json.dumps(manifest,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: HazRob-Tank-V7-R01-R02-R03-Geometry-Android-PDF-QA
          path: /tmp/v7-r01-pdf/
          if-no-files-found: error
          retention-days: 30
