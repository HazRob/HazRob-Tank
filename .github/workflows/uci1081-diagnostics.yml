name: HazRob Tank UCI1081 time-series/feature diagnostics (G2 research)
on:
  push:
    paths:
      - '.github/workflows/uci1081-diagnostics.yml'
      - 'research/benchmarks/uci1081_diagnostics_v1.py'
      - 'research/benchmarks/uci1081_actual_modules_v1.py'
      - 'research/techniques/02.2/**'
      - 'research/techniques/02.4/**'
      - 'research/techniques/02.7/**'
      - 'research/techniques/03.1/**'
      - 'research/techniques/03.2/**'
      - 'research/techniques/03.5/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference-array-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify UCI1081 archive SHA256 before parsing
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 20 --max-time 180 \
            'https://archive.ics.uci.edu/static/public/1081/gas%2Bsensor%2Barray%2Blow-concentration.zip' \
            --output uci1081_original.zip
          echo '813ebb7d00ed9172114b68d27ab3213170d6c220b8b23907dce91e9838cd48ab  uci1081_original.zip' | sha256sum --check
      - name: Execute UCI1081 independent-fold numerical diagnostics on six actual modules
        shell: bash
        run: |
          set -euo pipefail
          python research/benchmarks/uci1081_diagnostics_v1.py uci1081_original.zip --output uci1081_diagnostics_result.json | tee uci1081_diagnostics.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uci1081-actual-technique-diagnostics
          path: |
            uci1081_diagnostics_result.json
            uci1081_diagnostics.log
          if-no-files-found: warn
          retention-days: 90
