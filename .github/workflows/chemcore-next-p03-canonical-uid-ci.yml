name: ChemCore Next P03.4 source-to-734-SQLite canonical UID research audit

on:
  push:
    branches: [feature/tank-v8-implementation]
    paths:
      - 'android/app/src/test/java/com/servoc/app/chemical/ChemCoreNextLegacySourceUidAuditTest.java'
      - 'android/app/src/test/java/com/servoc/app/chemical/ChemCoreNextUnlinkedSourceCasAuditTest.java'
      - 'android/app/src/test/java/com/servoc/app/chemical/ChemCoreNextUnifiedCatalogGeneralHazardTest.java'
      - 'android/app/src/test/java/com/servoc/app/chemical/ChemCoreNextGeneralSourceAliasTest.java'
      - 'android/app/src/main/java/com/servoc/app/chemical/ChemCoreNextGeneralIdentityBootstrap.java'
      - 'android/app/src/main/java/com/servoc/app/chemical/ChemCoreNextGeneralHazardBootstrap.java'
      - 'research/chemcore_next/identity/chemcore_next_p03_4_unlinked_60_source_identity_policy.csv'
      - '.github/workflows/chemcore-next-p03-canonical-uid-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p03-4-independent-source-catalog-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Tank source overlay (engine research only, not APK)
        uses: actions/checkout@v4
        with:
          path: tank
      - name: Checkout pinned original catalog base
        uses: actions/checkout@v4
        with:
          repository: sohpany/SERVOC-Android
          ref: 6281d3eb7c1c961ce63b0b5e4ae0792874626720
          path: source
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK test platform
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Apply V8 storage overlay for independent engine/catalog verification
        shell: bash
        run: |
          set -euo pipefail
          cp -a tank/android/app/src/main/java/. source/app/src/main/java/
          cp -a tank/android/app/src/main/res/. source/app/src/main/res/
          cp -a tank/android/app/src/main/assets/. source/app/src/main/assets/
          cp tank/research/chemcore_next/identity/chemcore_next_p03_4_unlinked_60_source_identity_policy.csv \
            source/app/src/main/assets/chemcore_next_p03_4_unlinked_60_source_identity_policy.csv
          mkdir -p source/app/src/test/java
          cp -a tank/android/app/src/test/java/. source/app/src/test/java/
          cat >> source/app/build.gradle <<'GRADLE'
          android { testOptions { unitTests.includeAndroidResources = true } }
          dependencies {
              testImplementation 'org.robolectric:robolectric:4.14.1'
              testImplementation 'androidx.test:core:1.6.1'
          }
          GRADLE
      - name: Run 49 legacy and 60 NIOSH-CAS source identity lookups against actual 734-master SQLite
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:testDebugUnitTest \
            --tests com.servoc.app.chemical.ChemCoreNextLegacySourceUidAuditTest \
            --tests com.servoc.app.chemical.ChemCoreNextUnlinkedSourceCasAuditTest \
            --tests com.servoc.app.chemical.ChemCoreNextUnifiedCatalogGeneralHazardTest \
            --tests com.servoc.app.chemical.ChemCoreNextGeneralSourceAliasTest \
            2>&1 | tee ../P03-4-SQLITE-UID-TEST.log
          grep -q 'BUILD SUCCESSFUL' ../P03-4-SQLITE-UID-TEST.log
      - name: Confirm five existing/new generic classes share main catalog and hazard table
        shell: bash
        run: |
          set -euo pipefail
          grep -Rh 'CHEMCORE_NEXT_SINGLE_UNIFIED_GHS_CATALOG_PASS' \
            source/app/build/test-results/testDebugUnitTest/
      - name: Export all 16 generic source-to-master category IDs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob,csv,xml.etree.ElementTree as ET
          rows=[]
          success=False
          for p in glob.glob("source/app/build/test-results/testDebugUnitTest/*.xml"):
              doc=ET.parse(p).getroot()
              for node in doc.iter("system-out"):
                  for line in (node.text or "").splitlines():
                      if line.startswith("P03_4_GENERAL_SOURCE_ROW|"):
                          values=line.split("|")[1:]
                          assert len(values)==6,(len(values),line)
                          rows.append(values)
                      if line.startswith("CHEMCORE_NEXT_GENERAL_ALIAS_MAPPING_PASS"):
                          success=True
          assert success,"missing 16 generic aliases acceptance"
          assert len(rows)==16 and len({x[0] for x in rows})==16
          with open("P03-4-GENERAL-ALIAS-UID-16.csv","w",newline="",encoding="utf8") as stream:
              writer=csv.writer(stream)
              writer.writerow(["source_curve_uid","source_sensor","original_source_label",
                  "canonical_general_category","existing_master_uid","qualification"])
              writer.writerows(rows)
          for rec in rows:
              print("P03_4_GENERAL_UID_ROW|"+"|".join(rec))
          print("P03_4_GENERAL_UID_EXPORT_PASS mapped=16 categories=5 gas_identity=0")
          PY
      - name: Export 49 audited source mappings from JUnit XML for offline ChemCore Next
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv,glob,xml.etree.ElementTree as ET
          found=[]
          success=False
          for path in glob.glob("source/app/build/test-results/testDebugUnitTest/*.xml"):
              root=ET.parse(path).getroot()
              for node in root.iter("system-out"):
                  for line in (node.text or "").splitlines():
                      if line.startswith("P03_4_LEGACY_CROSSWALK|"):
                          cells=line.split("|")[1:]
                          assert len(cells)==7, (len(cells),line)
                          found.append(cells)
                      elif line.startswith("P03_4_LEGACY_MAPPING_PASS"):
                          success=True
          assert success, "missing test run success marker"
          assert len(found)==49, "expected exactly 49 reference mappings"
          assert len({row[0] for row in found})==49, "duplicate source curve IDs"
          with open("P03-4-UID-CROSSWALK-49.csv","w",newline="",encoding="utf8") as fh:
              writer=csv.writer(fh)
              writer.writerow(["v6_source_curve_id","source_sensor","source_label","legacy_reference_id","actual_sqlite_master_uid","master_name","master_cas"])
              writer.writerows(found)
          for row in found:
              print("P03_4_UID_ROW|"+ "|".join(row))
          print("P03_4_UID_EXPORT_PASS rows=49 qualified_gas_identifications=0")
          PY
      - name: Export 60 strict-CAS source mappings and abstention classifications
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, glob, xml.etree.ElementTree as ET
          rows=[]
          passed=False
          for path in glob.glob("source/app/build/test-results/testDebugUnitTest/*.xml"):
              root=ET.parse(path).getroot()
              for node in root.iter("system-out"):
                  for line in (node.text or "").splitlines():
                      if line.startswith("P03_4_CAS_SOURCE_ROW|"):
                          v=line.split("|")[1:]
                          assert len(v)==10,(len(v),line)
                          rows.append(v)
                      elif line.startswith("P03_4_CAS_AUDIT_PASS"):
                          passed=True
                          print(line)
          assert passed, "CAS audit success output missing"
          assert len(rows)==60, f"expected 60 source labels, got {len(rows)}"
          assert len({x[0] for x in rows})==60, "duplicate source ID"
          headers=["source_curve_uid","sensor_model","source_label","source_policy",
                   "catalog_resolution_status","catalog_master_uid",
                   "catalog_name","catalog_cas","origin_root","source_blob_sha"]
          with open("P03-4-SOURCE-UID-CROSSWALK-60.csv","w",encoding="utf8",newline="") as f:
              writer=csv.writer(f)
              writer.writerow(headers)
              writer.writerows(rows)
          for rec in rows:
              print("P03_4_CAS_ROW|"+"|".join(rec))
          count=sum(bool(x[5]) for x in rows)
          print(f"P03_4_CAS_EXPORT_PASS rows={len(rows)} exact_mapped={count} abstained={len(rows)-count} identity_qualified=0")
          PY
      - name: Preserve actual UID export and database test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChemCore-Next-P03-4-Historical-UID-Evidence
          path: |
            P03-4-UID-CROSSWALK-49.csv
            P03-4-SOURCE-UID-CROSSWALK-60.csv
            P03-4-GENERAL-ALIAS-UID-16.csv
            P03-4-SQLITE-UID-TEST.log
            source/app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 30
