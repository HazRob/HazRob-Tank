name: ChemCore V6 clean air signal gate mathematical regression
on:
  push:
    branches: [feature/tank-v6-implementation]
    paths:
      - 'android/app/src/main/java/com/hazrob/tank/chemcore/v6/CleanAirResponseGateV6.java'
      - 'android/app/src/main/java/com/hazrob/tank/chemcore/v6/CleanAirReferenceStatisticsV14.java'
      - 'research/chemcore_v6/tests/java/CleanAirReferenceStatisticsV14Test.java'
      - 'research/chemcore_v6/tests/java/CleanAirResponseGateV6Test.java'
      - '.github/workflows/chemcore-v6-clean-air-response-gate-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-signal-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile source-only V6 signal gate and test baseline, drift, response
        run: |
          set -euo pipefail
          mkdir -p /tmp/v6-response-gate
          javac -d /tmp/v6-response-gate \
            android/app/src/main/java/com/hazrob/tank/chemcore/v6/SourceCatalog.java \
            android/app/src/main/java/com/hazrob/tank/chemcore/v6/AlternativeCurveCatalog.java \
            android/app/src/main/java/com/hazrob/tank/chemcore/v6/Engine.java \
            android/app/src/main/java/com/hazrob/tank/chemcore/v6/CleanAirResponseGateV6.java \
            research/chemcore_v6/tests/java/CleanAirResponseGateV6Test.java \\
            android/app/src/main/java/com/hazrob/tank/chemcore/v6/CleanAirReferenceStatisticsV14.java \\
            research/chemcore_v6/tests/java/CleanAirReferenceStatisticsV14Test.java
          java -cp /tmp/v6-response-gate com.hazrob.tank.chemcore.v6.CleanAirResponseGateV6Test
          java -cp /tmp/v6-response-gate com.hazrob.tank.chemcore.v6.CleanAirReferenceStatisticsV14Test
