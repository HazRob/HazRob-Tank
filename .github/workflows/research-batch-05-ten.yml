name: HazRob Tank batch 05 — ten technique unit gates
on:
  push:
    paths:
      - '.github/workflows/research-batch-05-ten.yml'
      - 'research/techniques/05.8/**'
      - 'research/techniques/05.9/**'
      - 'research/techniques/06.1/**'
      - 'research/techniques/06.2/**'
      - 'research/techniques/06.3/**'
      - 'research/techniques/06.4/**'
      - 'research/techniques/06.5/**'
      - 'research/techniques/06.6/**'
      - 'research/techniques/06.7/**'
      - 'research/techniques/06.8/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-gate:
    name: unit gate ${{ matrix.technique }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        technique: ['05.8', '05.9', '06.1', '06.2', '06.3', '06.4', '06.5', '06.6', '06.7', '06.8']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research test dependencies
        run: python -m pip install numpy
      - name: Compile and run isolated technique tests
        working-directory: research/techniques/${{ matrix.technique }}
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q .
          python -m unittest discover -v -p 'test_*.py' 2>&1 | tee "$RUNNER_TEMP/unittest.log"
          if ! grep -Eq '^Ran [1-9][0-9]* tests?' "$RUNNER_TEMP/unittest.log"; then
            echo 'ERROR: No verifiable tests executed' >&2
            exit 1
          fi
          echo "## ${{ matrix.technique }} unit test results" >> "$GITHUB_STEP_SUMMARY"
          grep -E '^Ran [0-9]+ tests?|^OK$|^FAILED' "$RUNNER_TEMP/unittest.log" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batch05-${{ matrix.technique }}-unit-log
          path: ${{ runner.temp }}/unittest.log
          if-no-files-found: warn
          retention-days: 90
