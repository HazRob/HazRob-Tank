name: ChemCore Next P03.2 source curve provenance and formula replay

on:
  push:
    branches: [feature/tank-v8-implementation]
    paths:
      - 'research/chemcore_next/source_curves/**'
      - 'research/chemcore_next/fingerprints/**'
      - 'research/chemcore_next/tools/verify_p03_3_fingerprints.py'
      - 'research/chemcore_next/identity/**'
      - 'research/chemcore_next/tools/verify_p03_4_uid_crosswalk.py'
      - 'research/chemcore_next/identity/chemcore_next_p03_4_unlinked_60_source_identity_policy.csv'
      - 'research/chemcore_next/tools/verify_p03_4_unlinked_policy.py'
      - 'research/chemcore_next/identity/chemcore_next_p03_4_verified_full_109_source_uid_crosswalk.csv'
      - 'research/chemcore_next/selectivity/**'
      - 'research/chemcore_next/tools/verify_p03_4_5_identity_selectivity.py'
      - 'android/app/src/main/java/com/hazrob/tank/chemcore/v6/GasFingerprintCatalogV6.java'
      - 'research/chemcore_next/tools/verify_p03_2_source_curves.py'
      - 'research/chemcore_next/mqdata_v7_source_gas_curve_register_89.csv'
      - 'android/app/src/main/java/com/hazrob/tank/chemcore/v6/SourceCatalog.java'
      - 'android/app/src/main/java/com/hazrob/tank/chemcore/v6/AlternativeCurveCatalog.java'
      - '.github/workflows/chemcore-next-p03-source-provenance-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-source-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile 89 plus 6 plus 14 numeric formulas with original V6 Java
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile research/chemcore_next/tools/verify_p03_2_source_curves.py
          python3 research/chemcore_next/tools/verify_p03_2_source_curves.py \
            --out research/chemcore_next/source_curves/P03-2-CI-RESULT.json \
            | tee P03-2-CURVE-VALIDATION.log
          grep -q '^CHEMCORE_NEXT_P03_2_SOURCE_CURVES_PASS ' P03-2-CURVE-VALIDATION.log
      - name: Validate P03.3 three distinct fingerprint feature spaces and source 3D/4D provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile research/chemcore_next/tools/verify_p03_3_fingerprints.py
          python3 research/chemcore_next/tools/verify_p03_3_fingerprints.py \
            --out research/chemcore_next/fingerprints/P03-3-CI-RESULT.json \
            | tee P03-3-FINGERPRINT-VALIDATION.log
          grep -q '^CHEMCORE_NEXT_P03_3_FINGERPRINT_PASS ' P03-3-FINGERPRINT-VALIDATION.log
      - name: Confirm P03.4 canonical source crosswalk with conservative abstention
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile research/chemcore_next/tools/verify_p03_4_uid_crosswalk.py
          python3 research/chemcore_next/tools/verify_p03_4_uid_crosswalk.py \
            --out research/chemcore_next/identity/P03-4-CI-RESULT.json \
            | tee P03-4-UID-VALIDATION.log
          grep -q '^CHEMCORE_NEXT_P03_4_UID_CROSSWALK_PASS ' P03-4-UID-VALIDATION.log
      - name: Verify P03.4 NIOSH CAS source metadata, CAS checksum and abstention policy
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile research/chemcore_next/tools/verify_p03_4_unlinked_policy.py
          python3 research/chemcore_next/tools/verify_p03_4_unlinked_policy.py \
            --out research/chemcore_next/identity/P03-4-CAS-POLICY-CI-RESULT.json \
            | tee P03-4-CAS-POLICY-VALIDATION.log
          grep -q '^CHEMCORE_NEXT_P03_4_SOURCE_CAS_POLICY_PASS ' \
            P03-4-CAS-POLICY-VALIDATION.log
      - name: Validate all 109 source UID links and 8 by 21 selectivity overlap matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile research/chemcore_next/tools/verify_p03_4_5_identity_selectivity.py
          python3 research/chemcore_next/tools/verify_p03_4_5_identity_selectivity.py \
            --out research/chemcore_next/selectivity/P03-4-5-CI-RESULT.json \
            | tee P03-4-5-SELECTIVITY-VALIDATION.log
          grep -q '^CHEMCORE_NEXT_P03_4_5_SELECTIVITY_PASS ' \
            P03-4-5-SELECTIVITY-VALIDATION.log
      - name: Preserve source audit and inverse math evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChemCore-Next-P03-2-Source-Curve-Audit
          path: |
            P03-2-CURVE-VALIDATION.log
            research/chemcore_next/source_curves/P03-2-CI-RESULT.json
            P03-3-FINGERPRINT-VALIDATION.log
            research/chemcore_next/fingerprints/P03-3-CI-RESULT.json
            P03-4-UID-VALIDATION.log
            research/chemcore_next/identity/P03-4-CI-RESULT.json
            P03-4-CAS-POLICY-VALIDATION.log
            research/chemcore_next/identity/P03-4-CAS-POLICY-CI-RESULT.json
            P03-4-5-SELECTIVITY-VALIDATION.log
            research/chemcore_next/selectivity/P03-4-5-CI-RESULT.json
          if-no-files-found: warn
          retention-days: 30
