name: HazRob Tank batch 03 — ten technique unit gates
on:
  push:
    paths:
      - '.github/workflows/research-batch-03-ten.yml'
      - 'research/techniques/03.6/**'
      - 'research/techniques/03.7/**'
      - 'research/techniques/03.8/**'
      - 'research/techniques/04.1/**'
      - 'research/techniques/04.2/**'
      - 'research/techniques/04.3/**'
      - 'research/techniques/04.4/**'
      - 'research/techniques/04.5/**'
      - 'research/techniques/04.6/**'
      - 'research/techniques/04.7/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-gate:
    name: unit gate ${{ matrix.technique }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        technique: ['03.6', '03.7', '03.8', '04.1', '04.2', '04.3', '04.4', '04.5', '04.6', '04.7']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install standard research dependencies
        run: python -m pip install numpy
      - name: Compile and run isolated technique tests
        working-directory: research/techniques/${{ matrix.technique }}
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q .
          python -m unittest discover -v -p 'test_*.py' 2>&1 | tee "$RUNNER_TEMP/unittest.log"
          if ! grep -Eq '^Ran [1-9][0-9]* tests?' "$RUNNER_TEMP/unittest.log"; then
            echo 'ERROR: No verifiable tests executed' >&2
            exit 1
          fi
          echo "## ${{ matrix.technique }} unit test results" >> "$GITHUB_STEP_SUMMARY"
          grep -E '^Ran [0-9]+ tests?|^OK$|^FAILED' "$RUNNER_TEMP/unittest.log" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batch03-${{ matrix.technique }}-unit-log
          path: ${{ runner.temp }}/unittest.log
          if-no-files-found: warn
          retention-days: 90
