name: HazRob Tank food freshness module isolation

on:
  push:
    branches: [feature/tank-v6-implementation]
    paths:
      - 'research/food_freshness/**'
      - 'android/app/src/main/java/com/hazrob/tank/foodfreshness/**'
      - 'android/app/src/main/assets/food_freshness/**'
      - 'android/app/src/main/assets/chemcore_v6/**'
      - 'research/chemcore_v6/source_manifest.json'
      - 'research/chemcore_v6/source_audit.py'
      - 'android/app/src/main/java/com/hazrob/tank/chemcore/v6/**'
      - '.github/workflows/food-freshness-isolation-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  separate-food-from-gas:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify archival food profiles remain byte-identical and outside gas ChemCore
        run: |
          python -m unittest discover -s research/food_freshness -p 'test_*.py' -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile independent food engine and compare all 59 study patterns
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/food-freshness-classes
          javac -d /tmp/food-freshness-classes \
            android/app/src/main/java/com/hazrob/tank/foodfreshness/FoodReferenceCatalog.java \
            android/app/src/main/java/com/hazrob/tank/foodfreshness/FoodFreshnessEngine.java \
            research/food_freshness/FoodFreshnessEngineTest.java
          javac -d /tmp/food-freshness-classes \
            android/app/src/main/java/com/hazrob/tank/foodfreshness/meat/BeefResearchCatalog.java \
            android/app/src/main/java/com/hazrob/tank/foodfreshness/meat/BeefResearchEngine.java \
            research/food_freshness/BeefResearchEngineTest.java
          java -cp /tmp/food-freshness-classes com.hazrob.tank.foodfreshness.meat.BeefResearchEngineTest
          java -cp /tmp/food-freshness-classes com.hazrob.tank.foodfreshness.FoodFreshnessEngineTest
          ! grep -R -nE '^import com[.]hazrob[.]tank[.]chemcore|^import com[.]servoc[.]app[.]chemcore' \
            android/app/src/main/java/com/hazrob/tank/foodfreshness
      - name: Explain boundary
        run: |
          echo "Food freshness is a separate feature, not a gas ChemCore source"
          echo "59 food headspace profiles are not gas ppm curves, and cannot enter gas candidate ranking"
