name: Tank V3 physics ML / simulation / sim-to-real research-only tests
on:
  push:
    paths:
      - '.github/workflows/research-v3-physics-sim.yml'
      - 'research/benchmarks/physics_ml_sim_research_v2.py'
      - 'research/benchmarks/test_physics_ml_sim_research_v2.py'
  pull_request:
    paths:
      - '.github/workflows/research-v3-physics-sim.yml'
      - 'research/benchmarks/physics_ml_sim_research_v2.py'
      - 'research/benchmarks/test_physics_ml_sim_research_v2.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-bounded-scientific-algorithm-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numeric algorithm dependencies
        run: |
          python -m pip install 'numpy==2.2.6' 'scikit-learn==1.6.1'
      - name: Fail closed on invalid units, noncausal evaluation and missing references
        run: |
          set -euo pipefail
          python -m compileall -q research/benchmarks/physics_ml_sim_research_v2.py
          python -m unittest discover -s research/benchmarks -p 'test_physics_ml_sim_research_v2.py' -v 2>&1 | tee physics_sim_v3_tests.log
          grep -Eq '^Ran ([1-9][0-9]|[1-9][0-9][0-9]+) tests' physics_sim_v3_tests.log
          grep -Eq '^OK$' physics_sim_v3_tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tank-v3-physics-sim-synthetic-unit-evidence
          path: physics_sim_v3_tests.log
          if-no-files-found: warn
          retention-days: 90
