name: Tank ChemCore V4 batch05 uncertainty and abstention research (not G3)
on:
  push:
    paths:
      - 'research/techniques/05.8/**'
      - 'research/techniques/05.9/**'
      - 'research/techniques/06.*/**'
      - 'research/implementation_execution/**'
      - '.github/workflows/chemcore80-v4-batch05.yml'
  pull_request:
    paths:
      - 'research/techniques/05.8/**'
      - 'research/techniques/05.9/**'
      - 'research/techniques/06.*/**'
      - 'research/implementation_execution/**'
      - '.github/workflows/chemcore80-v4-batch05.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  grouped-source-screening-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check frozen 80-technique V4 execution plan
        run: python research/implementation_execution/validate_plan_v4.py
      - name: Existing ten-technique research software baseline
        shell: bash
        run: |
          set -euo pipefail
          for id in 05.8 05.9 06.1 06.2 06.3 06.4 06.5 06.6 06.7 06.8; do
            (cd "research/techniques/$id" && python -m unittest discover -p 'test_*.py' -v)
          done
      - name: V4 source-blank/session-holdout/dependence negative tests
        run: python -m unittest -v research/implementation_execution/test_batch05_v2.py
      - name: Seven remaining source-calibration/open-set/uncertainty contracts
        run: python -m unittest -v research/implementation_execution/test_batch05_additional_v2.py
      - name: Assert no gas/occupational alarm qualification
        run: echo 'G1 research only, G2 new physical source unverified, Tank G3 remains 0/80'
