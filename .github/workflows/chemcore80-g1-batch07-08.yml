name: ChemCore80 G1 Batch07-08 independent verification
on:
  push:
    branches:
      - research/chemcore80-central-evidence-gap-analysis-20261021
    paths:
      - 'research/techniques/**'
      - 'research/implementation_execution/**'
      - '.github/workflows/chemcore80-g1-batch07-08.yml'
  workflow_dispatch:
jobs:
  g1-batch07:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Batch07 ten techniques
        run: python -m unittest -v research/implementation_execution/test_batch07_v2.py
      - name: Verify 08.9 numerical regression
        run: python -m unittest discover -v -s research/techniques/08.9 -p 'test_nonnegative_rank_guard_v2_regression.py'
  g1-batch08:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify six Batch08 gates
        run: python -m unittest discover -v -s research/implementation_execution -p 'test_batch08_six_gates_v2.py'
      - name: Verify 08.10 multioutput regression
        run: python -m unittest discover -v -s research/techniques/08.10 -p 'test_source_multioutput_fit_v2.py'
      - name: Verify 10.1 joint negative evidence
        run: python -m unittest discover -v -s research/techniques/10.1 -p 'test_joint_negative_evidence_v2.py'
      - name: Verify pose fusion
        run: python -m unittest discover -v -s research/techniques/09.5 -p 'test_causal_pose_fusion_v2.py'
      - name: Verify motion decision guard
        run: python -m unittest discover -v -s research/techniques/09.6 -p 'test_motion_decision_guard_v2.py'
