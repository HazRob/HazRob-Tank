name: ChemCore V6 real MQ sensor evidence — gases and concentrations

on:
  push:
    branches: [feature/tank-v6-implementation]
    paths:
      - 'research/chemcore_v6/benchmarks/RealMqSourceV6Benchmark.java'
      - '.github/workflows/chemcore-v6-real-mq-multi-gas-concentrations.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-original-mq-source-measurements:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify original 6400 recorded MQ ADC source data and official UCI1081 gas-concentration source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v6-real-mq
          RAW=research/chemcore_v6/source_snapshots/external/mq_ext_03_multimodal_6400_raw.csv
          expected=13c2c85cfbb23357a71555b9bc2cbe7dd68e931ffc94df30389c1a4631203745
          measured="$(sha256sum "$RAW" | cut -d ' ' -f 1)"
          if [ "$expected" != "$measured" ]; then
            echo "FAIL-CLOSED MQ6400 SHA mismatch: $measured"; exit 1
          fi
          echo "PASS verified real-source MQ6400 raw CSV SHA256 $measured"
          python research/chemcore_v6/benchmarks/extract_uci1081_verified.py \
            --out /tmp/v6-real-mq/uci1081_original_verified_30features.csv \
            --manifest /tmp/v6-real-mq/uci1081_source_manifest.json
      - name: Compile exact independent V6 research Java inference methods
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v6-real-mq/classes
          javac -d /tmp/v6-real-mq/classes \
            android/app/src/main/java/com/hazrob/tank/chemcore/v6/ClassicalLearningV6.java \
            android/app/src/main/java/com/hazrob/tank/chemcore/v6/SourceValidationV6.java \
            android/app/src/main/java/com/hazrob/tank/chemcore/v6/SourceNumericsV6.java \
            research/chemcore_v6/benchmarks/RealMqSourceV6Benchmark.java
      - name: Run actual source ADC MQ array + real MQ135 multiple gas and concentrations
        shell: bash
        run: |
          set -euo pipefail
          java -cp /tmp/v6-real-mq/classes \
            com.hazrob.tank.chemcore.v6.RealMqSourceV6Benchmark \
            research/chemcore_v6/source_snapshots/external/mq_ext_03_multimodal_6400_raw.csv \
            /tmp/v6-real-mq/uci1081_original_verified_30features.csv \
            /tmp/v6-real-mq/mq6400_blocked_class_metrics.csv \
            /tmp/v6-real-mq/mq6400_blocked_predictions.csv \
            /tmp/v6-real-mq/mq135_six_gas_concentration_holdout_class_metrics.csv \
            /tmp/v6-real-mq/mq135_six_gas_concentration_holdout_predictions.csv \
            /tmp/v6-real-mq/mq135_concentration_error_by_exposure.csv
      - name: Independently audit all blocked source folds and quantitative coverage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,collections,math,statistics,json,hashlib,pathlib
          root=pathlib.Path('/tmp/v6-real-mq')
          def read(name):
            with (root/name).open(newline='',encoding='utf8') as f:
              return list(csv.DictReader(f))
          raw=read('mq6400_blocked_class_metrics.csv')
          pred=read('mq6400_blocked_predictions.csv')
          idrows=read('mq135_six_gas_concentration_holdout_class_metrics.csv')
          idpred=read('mq135_six_gas_concentration_holdout_predictions.csv')
          conc=read('mq135_concentration_error_by_exposure.csv')
          assert len(raw)==15 and len(pred)==19200, (len(raw),len(pred))
          assert len(idrows)==3 and len(idpred)==90 and len(conc)==90
          for mode in ('MQ135_only','TANK_OVERLAP_6_MQ','SOURCE_ALL_7_MQ'):
            folds=[x for x in raw if x['mode']==mode]
            assert sorted(int(x['fold']) for x in folds)==list(range(5))
            rows=[x for x in pred if x['mode']==mode]
            assert len(rows)==6400 and len(set(x['source_serial'] for x in rows))==6400
            assert all(x['source_raw_adc_no_ppm']=='true' for x in rows)
            ba=statistics.mean(float(x['balanced_accuracy']) for x in folds)
            f1=statistics.mean(float(x['macro_f1']) for x in folds)
            acc=statistics.mean(float(x['accuracy']) for x in folds)
            print(f'MQ_REAL_CLASS mode={mode} blocks=5 rows=6400 accuracy={acc:.6f} balanced_accuracy={ba:.6f} macro_f1={f1:.6f}')
          assert sorted(int(x['heldout_ppb']) for x in idrows)==[50,100,200]
          assert len(set(x['row_id'] for x in idpred))==90
          for row in conc:
            assert row['estimation_is_oracle_gas']=='true'
            assert int(row['true_ppb']) in (50,100,200)
            assert row['estimated_ppb']=='' or float(row['estimated_ppb'])>0
          for r in idrows:
            level=int(r['heldout_ppb'])
            split=[x for x in conc if int(x['heldout_ppb'])==level]
            assert len(split)==30
            states=collections.Counter(x['status'] for x in split)
            within=[float(x['absolute_error_ppb']) for x in split
                    if x['status']=='INTERPOLATION_INSIDE_REFERENCE_DOMAIN' and x['absolute_error_ppb']]
            allvalid=[float(x['absolute_error_ppb']) for x in split if x['absolute_error_ppb']]
            print(f'MQ_REAL_CONCENTRATION heldout_ppb={level} source_rows=30 gas_identity_balanced_accuracy={float(r["identity_balanced_accuracy"]):.6f} '
                  f'valid_inversion={len(allvalid)} interpolation_count={len(within)} '
                  f'conditional_abs_error_median_ppb={statistics.median(allvalid) if allvalid else "NA"} status_counts={dict(states)}')
          print('MQ_REAL_CONCENTRATION total_original_exposures=90 six_gases=6 concentrations_ppb=50,100,200')
          print('PASS REAL MQ audit: 6400 raw 6-overlap/7-source MQ rows, 90 MQ135 known-gas/level source exposures, zero invented channels')
          manifest={'schema':'chemcore-v6-real-mq-source-validation/1',
            'mq6400_original_source_sha256':'13c2c85cfbb23357a71555b9bc2cbe7dd68e931ffc94df30389c1a4631203745',
            'mq6400_source_classes':['NoGas','Perfume','Smoke','Mixture'],
            'mq6400_concentration_available':False,'mq6400_source_sensors':['MQ2','MQ3','MQ5','MQ6','MQ7','MQ8','MQ135'],
            'tank_six_source_overlap':['MQ2','MQ3','MQ5','MQ7','MQ8','MQ135'],
            'mq135_original_source_file_sha256':'d79afe6494903b988de68d4a8ab133167151a1bb620ba413e5cefd15003d07b3',
            'mq135_source_gases':['ethanol','acetone','toluene','ethyl acetate','isopropanol','hexane'],
            'mq135_source_concentrations_ppb':[50,100,200],
            'mq135_exposure_count':90,
            'source_ppb_below_manufacturer_reliable_limits':True,
            'concentration_inversion_conditioned_on_true_source_gas':True,
            'source_groups_not_independent_device_days':True,'tank_g3':False,
            'food_freshness_included':False}
          (root/'mq_source_manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: chemcore-v6-real-mq-multiple-gases-concentrations
          path: |
            /tmp/v6-real-mq/mq_source_manifest.json
            /tmp/v6-real-mq/uci1081_source_manifest.json
            /tmp/v6-real-mq/mq6400_blocked_class_metrics.csv
            /tmp/v6-real-mq/mq6400_blocked_predictions.csv
            /tmp/v6-real-mq/mq135_six_gas_concentration_holdout_class_metrics.csv
            /tmp/v6-real-mq/mq135_six_gas_concentration_holdout_predictions.csv
            /tmp/v6-real-mq/mq135_concentration_error_by_exposure.csv
          retention-days: 30
      - name: No field inference / physical G3 claims
        run: |
          echo "Measured source 6400 MQ ADC has categorical labels but NO ppm."
          echo "Measured source UCI MQ135 provides labelled 50/100/200 ppb but below manufacturer's robust quantification domain."
          echo "Train-only calibration, 90 gas-concentration exposures; no local Tank R0/Rs or physical G3."
          echo "No synthesis of Tank MQ4 or MQ9 readings and no food freshness data."
