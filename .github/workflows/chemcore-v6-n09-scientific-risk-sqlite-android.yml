name: ChemCore V6 N09 unified V14 MQ and clean-air reference catalog and scientific hazard references Android emulator
on:
  push:
    branches: [feature/tank-v6-implementation]
    paths:
      - 'android/app/src/main/java/com/servoc/app/data/ExperimentsDb.java'
      - 'android/app/src/main/java/com/servoc/app/data/ChemicalHazardSeedV11.java'
      - 'android/app/src/main/java/com/servoc/app/data/ChemicalHazardEvidenceSeedV13.java'
      - 'android/app/src/main/java/com/servoc/app/data/MqReferenceCurveSeedV14.java'
      - 'android/app/src/main/java/com/servoc/app/data/MqExternalR0RsSeedV14.java'
      - 'android/app/src/main/assets/chemcore_v6/reference/mq_external_r0_rs_peer_evidence_v14.json'
      - 'android/app/src/main/java/com/servoc/app/data/MqDeviceR0LedgerV14.java'
      - 'android/app/src/main/java/com/servoc/app/ui/DeveloperR0Tab.java'
      - 'android/app/src/main/java/com/servoc/app/chemical/ChemicalRepository.java'
      - 'android/app/src/main/java/com/servoc/app/chemical/GhsPictograms.java'
      - 'android/app/src/main/res/drawable/ghs_*.xml'
      - 'docs/licenses/GHS-VECTOR-SOURCE-LICENSE.md'
      - 'android/app/src/main/java/com/servoc/app/chemical/ChemicalSeedBootstrap.java'
      - 'android/app/src/main/java/com/servoc/app/chemical/ChemicalReferenceSyncV6.java'
      - 'android/app/src/main/java/com/servoc/app/chemical/ChemicalExperimentStatusRepository.java'
      - 'android/app/src/main/java/com/servoc/app/ui/ChemicalExperimentMatrixDialog.java'
      - 'android/app/src/main/java/com/servoc/app/ui/SettingsTab.java'
      - 'android/app/src/main/java/com/servoc/app/ui/StatusTab.java'
      - 'android/app/src/main/java/com/servoc/app/ui/DeveloperExperimentsTab.java'
      - 'android/app/src/main/java/com/servoc/app/ui/CentralLibraryDashboardTab.java'
      - 'updates/chemcore-records/v6/index.json'
      - 'android/app/src/main/java/com/servoc/app/chemical/ChemicalAliasMolecularProjectionV6.java'
      - 'android/app/src/main/java/com/servoc/app/chemical/ChemicalIdentityEquivalenceV6.java'
      - 'android/app/src/main/java/com/servoc/app/chemical/ChemicalIdentityCategoryV6.java'
      - 'android/app/src/main/java/com/servoc/app/chemical/ChemicalNistIdentityCompletionV6.java'
      - 'android/app/src/main/java/com/servoc/app/chemical/ChemicalNistEssentialGasMassV6.java'
      - 'android/app/src/main/java/com/servoc/app/chemical/ChemicalCasCorrectionV6.java'
      - 'android/app/src/main/java/com/servoc/app/chemcore/TankExposureReferenceCatalog.java'
      - 'research/chemcore_v6/tests/android/V6ScientificRiskDbFixtureActivity.java'
      - 'research/chemcore_v6/tests/android/run_n09_scientific_risk_db.sh'
      - '.github/workflows/chemcore-v6-n09-scientific-risk-sqlite-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-scientific-reference-v11:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: tank
      - uses: actions/checkout@v4
        with:
          repository: sohpany/SERVOC-Android
          ref: 6281d3eb7c1c961ce63b0b5e4ae0792874626720
          token: ${{ secrets.HAZROB_SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - name: Overlay Tank V13 unified catalog and temporary database fixture
        run: |
          set -euo pipefail
          cp -a tank/android/app/src/main/java/. source/app/src/main/java/
          mkdir -p source/app/src/main/assets
          cp -a tank/android/app/src/main/assets/. source/app/src/main/assets/
          if test -d tank/android/app/src/main/res; then
            cp -a tank/android/app/src/main/res/. source/app/src/main/res/
          fi
          cp tank/research/chemcore_v6/tests/android/V6ScientificRiskDbFixtureActivity.java source/app/src/main/java/com/servoc/app/report/
          python3 - <<'PY'
          from pathlib import Path
          p=Path('source/app/src/main/AndroidManifest.xml')
          s=p.read_text();n='<activity android:name=".MainActivity" android:exported="false"/>'
          assert n in s
          p.write_text(s.replace(n,'<activity android:name=".report.V6ScientificRiskDbFixtureActivity" android:exported="true"/>\n        '+n))
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: SDK setup
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Ephemeral test-only signing
        run: |
          mkdir -p source/signing
          keytool -genkeypair -alias hazrob-prototype -keystore source/signing/hazrob-prototype.jks \
            -storepass hazrob-prototype -keypass hazrob-prototype -keyalg RSA -keysize 2048 \
            -validity 1 -dname "CN=N09 SQLITE CI ONLY, OU=NOT FOR RELEASE, O=HazRob" -noprompt
      - name: Check offline asset bundle and source-license placement
        run: |
          test "$(find source/app/src/main/res/drawable -maxdepth 1 -name 'ghs_*.xml' | wc -l)" -eq 9
          test ! -e source/app/src/main/res/drawable/GHS-SOURCE-LICENSE.md
          test -f tank/docs/licenses/GHS-VECTOR-SOURCE-LICENSE.md
      - name: Build disposable emulator app with V13 seed
        working-directory: source
        run: gradle --no-daemon :app:assembleDebug
      - run: if test -c /dev/kvm; then sudo chmod a+rw /dev/kvm; fi
      - name: Execute actual source DB on Android API31 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          script: bash tank/research/chemcore_v6/tests/android/run_n09_scientific_risk_db.sh
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ChemCore-V6-V13-Actual-Chemical-Exposure-Reference-Inventory
          path: /tmp/v6-n09-scientific-risk/
          retention-days: 30
