name: ChemCore Tank V6 Android compile-only integration

on:
  push:
    branches: [feature/tank-v6-implementation]
    paths:
      - 'android/app/src/main/java/com/servoc/app/chemcore/**'
      - 'android/app/src/main/java/com/servoc/app/measurement/GasAlertCoordinator.java'
      - 'android/app/src/main/java/com/servoc/app/auth/TankFirmwareCompatibility.java'
      - 'android/app/src/main/java/com/servoc/app/calibration/FirmwareR0Contract.java'
      - 'android/app/src/main/java/com/servoc/app/calibration/ManualR0Calibration.java'
      - 'android/app/src/main/java/com/servoc/app/ReleaseAudit.java'
      - 'android/app/src/main/java/com/hazrob/tank/chemcore/v6/**'
      - 'android/app/src/main/java/com/hazrob/tank/v6integration/**'
      - 'android/app/src/main/java/com/hazrob/tank/foodfreshness/**'
      - 'android/app/src/main/java/com/servoc/app/ui/FoodFreshnessTab.java'
      - 'android/app/src/main/java/com/servoc/app/ui/MeasurementsTab.java'
      - 'android/app/src/main/java/com/servoc/app/ui/ChemCoreAnalysisTab.java'
      - 'android/app/src/main/java/com/servoc/app/ui/DeveloperR0Tab.java'
      - 'android/app/src/main/java/com/servoc/app/data/MqDeviceR0LedgerV14.java'
      - 'android/app/src/main/java/com/servoc/app/data/MqReferenceCurveSeedV14.java'
      - 'android/app/src/main/java/com/servoc/app/data/ExperimentsDb.java'
      - 'android/app/src/main/java/com/servoc/app/chemical/ChemicalRepository.java'
      - 'android/app/src/main/java/com/servoc/app/chemical/ChemicalSeedBootstrap.java'
      - 'android/app/src/main/java/com/servoc/app/chemical/ChemicalIdentityEquivalenceV6.java'
      - 'android/app/src/main/java/com/servoc/app/chemical/ChemicalIdentityCategoryV6.java'
      - 'android/app/src/main/java/com/servoc/app/chemical/ChemicalMolecularProjectionV6.java'
      - 'android/app/src/main/java/com/servoc/app/chemical/TankChemicalCapabilityReport.java'
      - 'research/chemcore_v6/tests/test_v6_stable_update_contract.py'
      - 'android/app/src/main/java/com/servoc/app/report/TankInstantReportPdf.java'
      - 'android/app/src/main/java/com/servoc/app/report/V6FieldSessionResearchAppendix.java'
      - 'android/app/src/main/java/com/servoc/app/report/SmartFieldSessionPdfWriter.java'
      - 'android/app/src/main/java/com/servoc/app/report/SmartFieldSessionXlsxWriter.java'
      - 'research/chemcore_v6/tests/test_v6_approved_session_report_contract.py'
      - 'research/chemcore_v6/tests/test_v6_android_instant_research_contract.py'
      - '.github/workflows/chemcore-v6-android-compile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: tank
      - name: Checkout frozen Android baseline, read only
        uses: actions/checkout@v4
        with:
          repository: sohpany/SERVOC-Android
          ref: 6281d3eb7c1c961ce63b0b5e4ae0792874626720
          token: ${{ secrets.HAZROB_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
      - name: Apply Tank V6 source overlay for syntax/type checking
        run: |
          set -euo pipefail
          cp -a tank/android/app/src/main/java/. source/app/src/main/java/
          if test -d tank/android/app/src/main/res; then
            cp -a tank/android/app/src/main/res/. source/app/src/main/res/
          fi
          echo "Pinned original Android app checked out read-only; Tank overlay only in temporary CI workspace"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Compile entire merged Android Java application (no APK)
        working-directory: source
        run: gradle --no-daemon :app:compileDebugJavaWithJavac
      - name: Check N06 V6-only instant/report boundaries (structural, not runtime)
        working-directory: tank
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest research/chemcore_v6/tests/test_v6_android_instant_research_contract.py -v
          python3 -m unittest research/chemcore_v6/tests/test_v6_approved_session_report_contract.py -v
          python3 -m unittest research/chemcore_v6/tests/test_v6_operator_release_contract.py -v
      - name: Record scope of validation
        run: |
          echo "PASS means Java/Android compilation only."
          echo "No APK was produced. No device, telemetry, heater, R0 or G3 test executed."
