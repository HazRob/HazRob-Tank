name: HazRob Tank batch 08 — final ten behavior-gated primitives
on:
  push:
    paths:
      - '.github/workflows/research-batch-08-ten.yml'
      - 'research/techniques/08.10/**'
      - 'research/techniques/08.11/**'
      - 'research/techniques/08.12/**'
      - 'research/techniques/09.1/**'
      - 'research/techniques/09.2/**'
      - 'research/techniques/09.3/**'
      - 'research/techniques/09.4/**'
      - 'research/techniques/09.5/**'
      - 'research/techniques/09.6/**'
      - 'research/techniques/10.1/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  behavioral-unit-gate:
    name: G1 technique ${{ matrix.technique }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        technique: ['08.10', '08.11', '08.12', '09.1', '09.2', '09.3', '09.4', '09.5', '09.6', '10.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and execute substantive behavioral unit tests
        working-directory: research/techniques/${{ matrix.technique }}
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q .
          python -m unittest discover -v -p 'test_*.py' 2>&1 | tee "$RUNNER_TEMP/unittest.log"
          if ! grep -Eq '^Ran (1[0-9]|[2-9][0-9]|[1-9][0-9][0-9]+) tests?' "$RUNNER_TEMP/unittest.log"; then
            echo 'ERROR: fewer than ten real tests executed' >&2
            exit 1
          fi
          if ! grep -Eq '^OK$' "$RUNNER_TEMP/unittest.log"; then
            echo 'ERROR: unittest run not OK' >&2
            exit 1
          fi
          echo "## ${{ matrix.technique }}" >> "$GITHUB_STEP_SUMMARY"
          grep -E '^Ran [0-9]+ tests?|^OK$|^FAILED' "$RUNNER_TEMP/unittest.log" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batch08-${{ matrix.technique }}-test-output
          path: ${{ runner.temp }}/unittest.log
          if-no-files-found: warn
          retention-days: 90
