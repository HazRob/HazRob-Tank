name: ChemCore Tank V6 N05-F original UCI1081 four new Java learners

on:
  push:
    branches: [feature/tank-v6-implementation]
    paths:
      - 'research/chemcore_v6/benchmarks/Uci1081N03FJavaBenchmark.java'
      - '.github/workflows/chemcore-v6-n05f-uci1081-java.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-uci1081-new-java-learners:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin official original UCI1081 source ZIP and CSV SHA256 before extraction
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/chemcore-v6-n05-f
          python research/chemcore_v6/benchmarks/extract_uci1081_verified.py \
            --out /tmp/chemcore-v6-n05-f/verified_features.csv \
            --manifest /tmp/chemcore-v6-n05-f/source_manifest.json
      - name: Compile independent Java supervised research models and source scorer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/chemcore-v6-n05-f/classes
          javac -d /tmp/chemcore-v6-n05-f/classes \
            android/app/src/main/java/com/hazrob/tank/chemcore/v6/SupervisedLearningResearchV6.java \
            android/app/src/main/java/com/hazrob/tank/chemcore/v6/SourceValidationV6.java \
            research/chemcore_v6/benchmarks/Uci1081N03FJavaBenchmark.java
      - name: Original 90-row three-concentration-heldout Java OVR evaluation
        shell: bash
        run: |
          set -euo pipefail
          java -cp /tmp/chemcore-v6-n05-f/classes \
            com.hazrob.tank.chemcore.v6.Uci1081N03FJavaBenchmark \
            /tmp/chemcore-v6-n05-f/verified_features.csv \
            /tmp/chemcore-v6-n05-f/heldout_predictions.csv \
            /tmp/chemcore-v6-n05-f/fold_metrics.csv
          python - <<'PY'
          import csv,collections,pathlib
          folder=pathlib.Path('/tmp/chemcore-v6-n05-f')
          pred=list(csv.DictReader((folder/'heldout_predictions.csv').open()))
          rows=list(csv.DictReader((folder/'fold_metrics.csv').open()))
          assert len(rows)==24 and len(pred)==720
          groups=collections.Counter((r['mode'],r['algorithm'],r['heldout_ppb']) for r in pred)
          assert len(groups)==24 and set(groups.values())=={30}
          for record in rows:
            assert record['training_exposures']=='60' and record['test_exposures']=='30'
            assert 0<=float(record['balanced_accuracy'])<=1
            assert 0<=float(record['macro_f1'])<=1
          for mode,model in sorted(set((r['mode'],r['algorithm']) for r in rows)):
            items=[r for r in rows if r['mode']==mode and r['algorithm']==model]
            assert len(items)==3
            acc=sum(float(r['balanced_accuracy']) for r in items)/3
            f1=sum(float(r['macro_f1']) for r in items)/3
            print(f'N05_F_MEAN mode={mode} model={model} balanced_accuracy={acc:.6f} macro_f1={f1:.6f}')
          print('PASS N05-F 24 grouped source validations and 720 heldout source predictions')
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: chemcore-v6-n05f-uci1081-original-java-four-learners
          path: |
            /tmp/chemcore-v6-n05-f/source_manifest.json
            /tmp/chemcore-v6-n05-f/fold_metrics.csv
            /tmp/chemcore-v6-n05-f/heldout_predictions.csv
          retention-days: 30
      - name: Research-only claims
        run: |
          echo "Original UCI external data, NOT Tank G3 or source-independent gas certification."
          echo "No manufacturer ppm, MQ135 hardware interchangeability, new device/day split or food freshness."
