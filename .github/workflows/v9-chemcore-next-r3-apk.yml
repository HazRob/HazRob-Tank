name: HazRob Tank V9.1 ChemCore Next R3 complete trace integration APK

on:
  push:
    branches: [feature/tank-v9-implementation]
    paths:
      - '.github/workflows/v9-chemcore-next-r3-apk.yml'
      - 'android/app/src/main/java/com/hazrob/tank/chemcore/next/**'
      - 'android/app/src/main/java/com/servoc/app/chemcore/nextintegration/**'
      - 'android/app/src/main/java/com/servoc/app/ReleaseAudit.java'
      - 'android/app/src/main/java/com/servoc/app/data/ExperimentsDb.java'
      - 'android/app/src/main/java/com/servoc/app/ui/MeasurementsTab.java'
      - 'android/app/src/main/java/com/servoc/app/report/**'
      - 'android/app/src/androidTest/java/com/servoc/app/chemcore/nextintegration/**'
      - 'research/chemcore_next/tests/java/NextCoherenceR2Regression.java'
      - 'research/chemcore_next/tests/java/NextIntegrityTraceR3Regression.java'
      - 'tools/prepare_v9_stable_source.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-v9-next-r3-debug-test:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout HazRob Tank V9 integration branch
        uses: actions/checkout@v4
        with:
          path: tank

      - name: Checkout pinned Android application base without altering upstream
        uses: actions/checkout@v4
        with:
          repository: sohpany/SERVOC-Android
          ref: 6281d3eb7c1c961ce63b0b5e4ae0792874626720
          token: ${{ secrets.HAZROB_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false

      - name: Stage complete Android V9 overlay and version 9 independently
        shell: bash
        run: |
          set -euo pipefail
          cp -a tank/android/app/src/main/java/. source/app/src/main/java/
          if test -d tank/android/app/src/main/res; then
            cp -a tank/android/app/src/main/res/. source/app/src/main/res/
          fi
          if test -d tank/android/app/src/main/assets; then
            mkdir -p source/app/src/main/assets
            cp -a tank/android/app/src/main/assets/. source/app/src/main/assets/
          fi
          if test -d tank/android/app/src/test/java; then
            mkdir -p source/app/src/test/java
            cp -a tank/android/app/src/test/java/. source/app/src/test/java/
          fi
          test -f source/app/src/main/java/com/hazrob/tank/chemcore/next/SourceRootCoherence.java
          test -f source/app/src/main/java/com/hazrob/tank/chemcore/next/NextAnalysisTrace.java
          test -f source/app/src/main/java/com/hazrob/tank/chemcore/next/NextResearchSourceQuarantine.java
          test -f source/app/src/main/java/com/servoc/app/chemcore/nextintegration/NextResearchTraceStore.java
          test -f source/app/src/main/java/com/servoc/app/chemcore/nextintegration/NextTraceSchema.java
          test -f source/app/src/main/java/com/servoc/app/report/V9NextR3TracePdfAnnex.java
          cp tank/tools/prepare_v9_stable_source.py source/tools/prepare_v9_stable_source.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          gradle=Path('source/app/build.gradle')
          s=gradle.read_text()
          for old,new in (
              ("applicationId 'com.servoc.app'","applicationId 'com.hazrob.tank'"),
              ("versionName '0.10.2'","versionName '9.1'"),
              ("versionCode 30","versionCode 10"),
              ("debug { signingConfig signingConfigs.prototype }","debug { }"),
          ):
              if s.count(old)!=1:raise SystemExit("Pinned Android build identity drift: "+old)
              s=s.replace(old,new,1)
          key="buildConfigField 'String', 'CHEMCORE_LIBRARY_MANIFEST_URL', "
          empty=key+"'"+chr(34)*2+"'"
          if s.count(empty)!=1:raise SystemExit("Stable update endpoint was changed")
          url="https://raw.githubusercontent.com/HazRob/HazRob-Tank/main/updates/chemcore-stable/manifest.json"
          s=s.replace(empty,key+"'"+chr(34)+url+chr(34)+"'",1)
          gradle.write_text(s)
          manifest=Path('source/app/src/main/AndroidManifest.xml')
          m=manifest.read_text()
          m,n=re.subn(r'android:label="[^"]*"','android:label="HazRob Tank V9.1"',m,count=1)
          if n!=1:raise SystemExit("Android label not found")
          manifest.write_text(m)
          release=Path('source/app/src/main/java/com/servoc/app/ReleaseAudit.java').read_text()
          core=Path('source/app/src/main/java/com/hazrob/tank/chemcore/next/ChemCoreNext.java').read_text()
          arbiter=Path('source/app/src/main/java/com/hazrob/tank/chemcore/next/NextResearchDecisionPipeline.java').read_text()
          router=Path('source/app/src/main/java/com/servoc/app/chemcore/nextintegration/NextEngineRouter.java').read_text()
          assert all(v in release for v in ('VERSION="9.1"','DATABASE_SCHEMA=16','CHEMCORE-NEXT-R3','GAS_RESPONSE_AUDIBLE_ALERT=false'))
          assert 'chemcore-next-research-core/0.3-g1-source-trace' in core
          assert 'sourceCoherence' in core and 'executionTrace' in core
          assert 'NextResearchSourceQuarantine' in core
          assert 'NextResearchDecisionPipeline.evaluate(' in core
          assert 'ChemCoreNext.analyze(research)' in router
          assert 'new NextDecisionStore(db).append(' in router
          assert 'sourceConcentrationCoherenceScore' in arbiter
          store=Path('source/app/src/main/java/com/servoc/app/chemcore/nextintegration/NextDecisionStore.java').read_text()
          assert 'appendWithTrace' in router and 'result.executionTrace' in router
          assert 'NextResearchTraceStore.append(' in store
          assert 'DB_VERSION=16' in Path('source/app/src/main/java/com/servoc/app/data/ExperimentsDb.java').read_text()
          assert 'NEXT_R3_ATOMIC_TRACE_SQLITE_V16=true' in release
          print('V9 core integrated into original Android runtime router')
          PY
          python3 source/tools/prepare_v9_stable_source.py source

      - name: Rebuild embedded Stable snapshot with V9 compatibility only
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          python3 tools/build_hr069_embedded_stable.py --out-dir app/build/generated/hazrobAssets/generated/chemcore/embedded_stable
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          root=Path('app/build/generated/hazrobAssets/generated/chemcore/embedded_stable')
          m=json.loads((root/'manifest.json').read_text())
          payload=(root/m['payload_file']).read_bytes()
          assert m['min_app_version']==m['max_app_version']=='9.1'
          assert m['chemical_count']==652 and m['calibration_count']==0
          assert m['payload_sha256']==hashlib.sha256(payload).hexdigest()
          assert m['payload_size_bytes']==len(payload)
          print('Stable payload verified; no calibration changed or source promoted')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Verify real R3 source analyzer with deterministic Java regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v9-test-apk/core-classes
          find tank/android/app/src/main/java/com/hazrob/tank/chemcore/next -maxdepth 1 -name '*.java' -print0 \
            | xargs -0 javac -encoding UTF-8 -d v9-test-apk/core-classes \
              tank/research/chemcore_next/tests/java/NextCoherenceR2Regression.java \
              tank/research/chemcore_next/tests/java/NextIntegrityTraceR3Regression.java
          java -cp v9-test-apk/core-classes com.hazrob.tank.chemcore.next.NextCoherenceR2Regression \
            | tee v9-test-apk/next-r2-compatibility.log
          java -cp v9-test-apk/core-classes com.hazrob.tank.chemcore.next.NextIntegrityTraceR3Regression \
            | tee v9-test-apk/next-r3-integrity-trace.log
          grep -q '^NEXT_COHERENCE_R2_REGRESSION_PASS' v9-test-apk/next-r2-compatibility.log
          grep -q '^NEXT_R3_TRACE_INTEGRITY_REGRESSION_PASS' v9-test-apk/next-r3-integrity-trace.log
          rm -rf v9-test-apk/core-classes

      - name: Verify existing V8 UI report session and R0 contracts preserved
        shell: bash
        working-directory: tank
        run: |
          set -euo pipefail
          python3 -m unittest \
            research/v8_implementation/tests/test_v8_next_instant_source_routing.py \
            research/v8_implementation/tests/test_v8_instant_capture_gate.py \
            research/v8_implementation/tests/test_v8_next_field_session_handoff.py \
            research/v8_implementation/tests/test_v8_next_operator_pdf_parity.py \
            research/v8_implementation/tests/test_v8_p11_5_operator_dual_r0.py \
            research/v8_implementation/tests/test_v8_p11_6_r0_pdf_parity.py \
            research/v8_implementation/tests/test_v8_report_data_lineage_and_v7_geometry.py \
            research/v8_implementation/tests/test_v8_feedback_local_and_authenticated_sync.py \
            research/v8_implementation/tests/test_v8_mq_sensor_card_resilience.py \
            -v

      - name: Compile and assemble complete Android V9 APK
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:compileDebugJavaWithJavac
          gradle --no-daemon --stacktrace :app:assembleDebug
          gradle --no-daemon --stacktrace :app:compileDebugAndroidTestJavaWithJavac

      - name: Verify V9 APK package, Stable payload and debug signing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,shutil,zipfile
          apk=Path('source/app/build/outputs/apk/debug/app-debug.apk')
          assert apk.is_file() and apk.stat().st_size>1_000_000
          with zipfile.ZipFile(apk) as z:
              prefix='assets/generated/chemcore/embedded_stable/'
              manifest=json.loads(z.read(prefix+'manifest.json'))
              payload=z.read(prefix+manifest['payload_file'])
              assert manifest['min_app_version']==manifest['max_app_version']=='9.1'
              assert manifest['chemical_count']==652 and manifest['calibration_count']==0
              assert manifest['payload_sha256']==hashlib.sha256(payload).hexdigest()
              assert 'classes.dex' in z.namelist()
          folder=Path('v9-test-apk')
          dest=folder/'HazRob-Tank-V9.1-ChemCore-Next-R3-FULL-TEST.apk'
          shutil.copyfile(apk,dest)
          digest=hashlib.sha256(dest.read_bytes()).hexdigest()
          (folder/'SHA256SUMS.txt').write_text(digest+'  '+dest.name+'\n')
          (folder/'BUILD-MANIFEST.json').write_text(json.dumps({
             'application_id':'com.hazrob.tank','version_name':'9.1','version_code':10,
             'repository':'HazRob/HazRob-Tank','git_commit':os.environ['GITHUB_SHA'],
             'apk_sha256':digest,'apk_size_bytes':dest.stat().st_size,
             'engine':'chemcore-next-research-core/0.3-g1-source-trace',
             'immutable_r3_trace_persisted_in_sqlite_v16':True,
             'all_r3_executed_events_exported_to_pdf_excel':True,
             'engine_source_coherence':'next-source-root-coherence/0.3-g1-integrity-trace',
             'database_schema':16,'embedded_stable_identities':652,
             'stable_calibration_qualifications':0,'firmware':'ESP32 V6 API4 unchanged',
             'signing':'default Android debug signing',
             'g3_validation':False,'field_ppm_certified':False
          },indent=2,ensure_ascii=False)+'\n')
          (folder/'INSTALL-NOTES.txt').write_text(
              'HazRob Tank V9.1 ChemCore Next R3 FULL TRACE TEST APK.\n'
              'Experimental debug build, NOT certified hazardous-gas detection.\n'
              'Preserves previous R_air settings in source, firmware V6 API4 unchanged.\n'
              'Debug signer may differ from installed V8. Do NOT uninstall before backing up sessions, sites and R0.\n'
              'R3 source trace exists inside analysis engine; G3 alarms and ppm are not authorized.\n'
              'Hardware, arm PCA9685 and LED changes remain pending separate owner decisions.\n')
          print('V9 APK',dest,'SHA256',digest)
          PY
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging v9-test-apk/HazRob-Tank-V9.1-ChemCore-Next-R3-FULL-TEST.apk \
            | tee v9-test-apk/aapt-badging.txt
          grep -q "package: name='com.hazrob.tank' versionCode='10' versionName='9.1'" v9-test-apk/aapt-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs \
            v9-test-apk/HazRob-Tank-V9.1-ChemCore-Next-R3-FULL-TEST.apk \
            | tee v9-test-apk/signing-verification.txt

      - name: Publish V9 APK build and reproducible evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HazRob-Tank-V9.1-ChemCore-Next-R3-FULL-TEST-APK
          path: v9-test-apk/
          retention-days: 90
          if-no-files-found: warn
