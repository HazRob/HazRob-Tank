name: ChemCore Next R3 nested source-only NoGas detector benchmark

on:
  push:
    branches: [research/chemcore-next-r3-integrity-trace-20261106]
    paths:
      - 'research/chemcore_next/experiments/r3_nested_binary_source_detection.py'
      - '.github/workflows/chemcore-next-r3-nested-nogas.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nested-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin source raw ADC
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object research/chemcore_v6/source_snapshots/external/mq_ext_03_multimodal_6400_raw.csv)" \
            = '451fdd05a18db8531abc219089de071ccc0dd461'
          mkdir -p /tmp/r3-binary
      - name: Exact scientific packages
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            numpy==2.3.5 scikit-learn==1.8.0 scipy==1.16.3
      - name: Purged outer folds and disjoint inner calibration for two-stage detection
        shell: bash
        run: |
          set -euo pipefail
          python research/chemcore_next/experiments/r3_nested_binary_source_detection.py \
            --source research/chemcore_v6/source_snapshots/external/mq_ext_03_multimodal_6400_raw.csv \
            --out /tmp/r3-binary \
            | tee /tmp/r3-binary/run.log
          grep -q '^R3_NESTED_SOURCE_BINARY_GATE_PASS ' /tmp/r3-binary/run.log
          python - <<'PY'
          import json
          x=json.load(open('/tmp/r3-binary/r3_nested_source_binary_gate_summary.json'))
          assert x['source_device_is_Tank'] is False
          assert x['nested_calibration_disjoint_from_training']
          assert not x['g3_physical']
          assert len(x['all_fold_metrics'])==30
          print('NESTED_SOURCE_RESEARCH_BOUNDARY_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chemcore-next-r3-nested-source-nogas-detection-ablation
          path: /tmp/r3-binary/
          if-no-files-found: warn
          retention-days: 90
