name: Research only ChemCore Next V8 Stable fingerprints x 80 technique audit

on:
  push:
    branches: [research/next-stable-fingerprint-cross-technique-audit-20261105]
    paths:
      - 'research/chemcore_next/experiments/v8_stable_fingerprint_technique_matrix.py'
      - 'research/chemcore_next/tests/java/NextStableSourceCurveFullEntryAudit.java'
      - '.github/workflows/next-v8-stable-fingerprint-80-technique-trace.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: HazRob/build-harness
          path: source-locked-central-stable
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Inventory locked Stable source references and technique execution disposition
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/stable-v8-audit
          python3 research/chemcore_next/experiments/v8_stable_fingerprint_technique_matrix.py \
            --tank . --stable source-locked-central-stable --out build/stable-v8-audit \
            | tee build/stable-v8-audit/inventory_run.log
          grep -q '^NEXT_STABLE_80_TECHNIQUE_TRACE_AUDIT_PASS ' build/stable-v8-audit/inventory_run.log
      - name: Compile EXACT V8 ChemCore Next Java sources plus research experiment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/stable-v8-audit/classes
          find android/app/src/main/java/com/hazrob/tank/chemcore/next -name '*.java' -print0 \
            | xargs -0 javac -encoding UTF-8 -d build/stable-v8-audit/classes \
              research/chemcore_next/tests/java/NextStableSourceCurveFullEntryAudit.java
      - name: Run all 43 curves x 7 samples through real engine and source math
        shell: bash
        run: |
          set -euo pipefail
          java -cp build/stable-v8-audit/classes \
            com.hazrob.tank.chemcore.next.NextStableSourceCurveFullEntryAudit \
            build/stable-v8-audit/source_curves_43_self_replay_301.csv \
            build/stable-v8-audit/actual_v8_core_43_curve_inference.csv \
            | tee build/stable-v8-audit/actual_core_run.log
          grep -q '^NEXT_STABLE_CURVE_ACTUAL_V8_CORE_AUDIT_PASS ' \
            build/stable-v8-audit/actual_core_run.log
      - name: Consolidate errors, compare software layer with scientific evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv,json,collections,pathlib,hashlib
          root=pathlib.Path('build/stable-v8-audit')
          with (root/'actual_v8_core_43_curve_inference.csv').open() as f:
              data=list(csv.DictReader(f))
          summary=json.loads((root/'audit_summary.json').read_text())
          groups={x: [r for r in data if r['scenario']==x] for x in sorted(set(r['scenario'] for r in data))}
          def rate(name):
              rows=groups[name]
              return {'cases':len(rows),'uid_top1':sum(r['top1_equal_source_uid']=='true' for r in rows),
                  'top1_fraction':sum(r['top1_equal_source_uid']=='true' for r in rows)/len(rows),
                  'median_candidate_count':sorted(int(r['eligible_count']) for r in rows)[len(rows)//2],
                  'status_counts':dict(collections.Counter(r['status'] for r in rows))}
          assert len(groups['ONE_SOURCE_INJECTED'])==len(groups['ALL_43_SOURCES_INJECTED'])==len(groups['ALL_SOURCE_GATES_UNVERIFIED'])==301
          assert len(groups['CLEAN_AIR_REFERENCE_ALL_43'])==8
          assert all(r['eligible_count']=='0' for r in groups['ALL_SOURCE_GATES_UNVERIFIED'])
          assert summary['source_item_technique_pairs']==266*80
          assert summary['source_math_43_curve_7_concentrations']==301
          assert summary['source_curve_register_95_active']==0
          assert summary['new_formula_register_active']==0
          outcome={
            'engine':'Exact android/app/src/main/java/com/hazrob/tank/chemcore/next/ChemCoreNext.java',
            'scenario_qualifications':'All mathematical injection test qualifications and physical R0 fabricated, NOT actual Tank!',
            'isolated':rate('ONE_SOURCE_INJECTED'),
            'simultaneous_all_43':rate('ALL_43_SOURCES_INJECTED'),
            'unverified_source_gates':rate('ALL_SOURCE_GATES_UNVERIFIED'),
            'clean_air_profiles':{
                'sensor_models':8,
                'models_with_eligible_candidates':sum(int(r['eligible_count'])>0 for r in groups['CLEAN_AIR_REFERENCE_ALL_43']),
                'individual_profiles':[{k:r[k] for k in ('sensor','eligible_count','status','top1_legacy_uid')} for r in groups['CLEAN_AIR_REFERENCE_ALL_43']]},
            'cannot_claim_real_Tank_identity_accuracy':True,'field_G3':False,
            'not_a_production_code_change':True
          }
          (root/'actual_v8_core_summary.json').write_text(json.dumps(outcome,ensure_ascii=False,indent=2)+'\n')
          with (root/'AUDIT_README.md').open('a') as f:
              f.write('\n## Exact actual V8 engine injections (all physical qualifications are synthetic!)\n')
              f.write(f"- Each source curve alone: {outcome['isolated']['uid_top1']}/{outcome['isolated']['cases']} return source legacy UID.\n")
              f.write(f"- All 43 curves provided: {outcome['simultaneous_all_43']['uid_top1']}/{outcome['simultaneous_all_43']['cases']} return source UID top-1.\n")
              f.write(f"- No verified source qualification: {outcome['unverified_source_gates']['median_candidate_count']} median eligible candidates.\n")
              f.write(f"- 8 all-curve clean-air sensor profiles: {outcome['clean_air_profiles']['models_with_eligible_candidates']} contain false candidate(s) under **fabricated true-source qualification**.\n")
              f.write('- All outcomes are synthetic stress software traces; no Tank real-gas or concentration accuracy can be inferred.\n')
          print('NEXT_V8_EXACT_CORE_CROSS_CURVE_ANALYSIS',json.dumps(outcome,sort_keys=True))
          print('NEXT_V8_STABLE_MATRIX_TYPES',json.dumps(summary['matrix_dispositions'],sort_keys=True))
          PY
      - name: Write reproducibility hashes for output files
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > build/stable-v8-audit/tank_research_commit.txt
          git -C source-locked-central-stable rev-parse HEAD > build/stable-v8-audit/stable_reference_commit.txt
          ( cd build/stable-v8-audit; sha256sum *.csv *.json *.md > file_hashes_sha256.txt )
      - name: Upload full diagnostic matrix without altering Stable, app or firmware
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ChemCoreNext_V8_STABLE_Fingerprint_x_80_Technique_Diagnostic
          path: build/stable-v8-audit/
          if-no-files-found: warn
          retention-days: 90
