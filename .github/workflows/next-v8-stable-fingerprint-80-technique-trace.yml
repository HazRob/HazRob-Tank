name: Research ChemCore Next V8 Stable fingerprints 80 techniques diagnostics

on:
  push:
    branches:
      - research/next-stable-fingerprint-cross-technique-audit-20261105
    paths:
      - 'research/chemcore_next/experiments/v8_stable_fingerprint_technique_matrix.py'
      - 'research/chemcore_next/tests/java/NextStableSourceCurveFullEntryAudit.java'
      - '.github/workflows/next-v8-stable-fingerprint-80-technique-trace.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Inventory complete source-locked records and 80 technique IDs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/stable-v8-audit/classes
          test "$(git hash-object research/chemcore_next/tests/source_fixtures/mq4_methane_source_fingerprint_copy_2026_11_02.json)" = acb3e16a79a6795c86d12ff1dbdbd01d6b11cb46
          test "$(git hash-object research/chemcore_next/tests/source_fixtures/stable_reference_manifest_2026_10_21.json)" = ea4ddf660724f0030d2aa3695c12fe85065fccb0
          python3 research/chemcore_next/experiments/v8_stable_fingerprint_technique_matrix.py \
            --tank . --out build/stable-v8-audit \
            | tee build/stable-v8-audit/inventory_run.log
          grep -q '^NEXT_STABLE_80_TECHNIQUE_TRACE_AUDIT_PASS ' build/stable-v8-audit/inventory_run.log
      - name: Compile exact original V8 source experts and arbiter
        shell: bash
        run: |
          set -euo pipefail
          find android/app/src/main/java/com/hazrob/tank/chemcore/next -name '*.java' -print0 \
            | xargs -0 javac -encoding UTF-8 -d build/stable-v8-audit/classes \
              research/chemcore_next/tests/java/NextStableSourceCurveFullEntryAudit.java
      - name: Replay all 43 curves and evaluate competing sources
        shell: bash
        run: |
          set -euo pipefail
          java -cp build/stable-v8-audit/classes \
            com.hazrob.tank.chemcore.next.NextStableSourceCurveFullEntryAudit \
            build/stable-v8-audit/source_curves_43_self_replay_301.csv \
            build/stable-v8-audit/actual_v8_core_43_curve_inference.csv \
            | tee build/stable-v8-audit/actual_core_run.log
          grep -q '^NEXT_STABLE_CURVE_ACTUAL_V8_CORE_AUDIT_PASS ' build/stable-v8-audit/actual_core_run.log
      - name: Evaluate full engine misranking and protect qualification boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv,json,collections,pathlib
          root=pathlib.Path('build/stable-v8-audit')
          with (root/'actual_v8_core_43_curve_inference.csv').open() as f:
            data=list(csv.DictReader(f))
          science=json.loads((root/'audit_summary.json').read_text())
          groups={k:[r for r in data if r['scenario']==k] for k in {r['scenario'] for r in data}}
          def result(name):
            rows=groups[name]
            return {
              'cases':len(rows),
              'top1_correct':sum(r['top1_equal_source_uid']=='true' for r in rows),
              'top1_fraction':sum(r['top1_equal_source_uid']=='true' for r in rows)/len(rows),
              'median_candidate_count':sorted(int(r['eligible_count']) for r in rows)[len(rows)//2],
              'status_counts':dict(collections.Counter(r['status'] for r in rows))
            }
          assert len(groups['ONE_SOURCE_INJECTED'])==301
          assert len(groups['ALL_43_SOURCES_INJECTED'])==301
          assert len(groups['ALL_SOURCE_GATES_UNVERIFIED'])==301
          assert len(groups['CLEAN_AIR_REFERENCE_ALL_43'])==8
          assert all(int(r['eligible_count'])==0 for r in groups['ALL_SOURCE_GATES_UNVERIFIED'])
          assert science['source_item_technique_pairs']==266*80
          assert science['new_formula_register_active']==0
          clean=groups['CLEAN_AIR_REFERENCE_ALL_43']
          summary={
            'truth':'SYNTHETIC_SOURCE_ONLY_NOT_PHYSICAL_TANK',
            'actual_v8_source':'android/app/src/main/java/com/hazrob/tank/chemcore/next/ChemCoreNext.java',
            'one_curve':result('ONE_SOURCE_INJECTED'),
            'all_43':result('ALL_43_SOURCES_INJECTED'),
            'unverified_gates':result('ALL_SOURCE_GATES_UNVERIFIED'),
            'clean_air_models_with_candidates':sum(int(r['eligible_count'])>0 for r in clean),
            'clean_air_sensor_profiles':[
              {k:r[k] for k in ('sensor','eligible_count','status','top1_legacy_uid')} for r in clean],
            'G3':False,'runtime_modified':False,
            'identification_accuracy_calibrated':False}
          (root/'actual_v8_core_summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          with (root/'AUDIT_README.md').open('a') as f:
            f.write('\n## Exact V8 core synthetic qualification stress (not gas accuracy)\n')
            f.write('One-curve source top1: '+str(summary['one_curve'])+'\n')
            f.write('All-43 source top1: '+str(summary['all_43'])+'\n')
            f.write('Clean-air sensor models with at least one false candidate: '+str(summary['clean_air_models_with_candidates'])+'\n')
          print('NEXT_V8_STABLE_FULL_CORE_AUDIT_PASS',json.dumps(summary,sort_keys=True))
          print('NEXT_V8_TECHNIQUE_MATRIX_BREAKDOWN',json.dumps(science['matrix_dispositions'],sort_keys=True))
          PY
      - name: Record source and result integrity
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > build/stable-v8-audit/research_commit.txt
          cd build/stable-v8-audit
          sha256sum *.csv *.json *.md > file_hashes_sha256.txt
      - name: Preserve audit diagnostic artifacts only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChemCoreNext_STABLE_x80_Fingerprint_Diagnostic
          path: build/stable-v8-audit/
          if-no-files-found: warn
          retention-days: 90
