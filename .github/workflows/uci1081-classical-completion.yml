name: HazRob Tank classical algorithm completion (real UCI1081)
on:
  push:
    paths:
      - '.github/workflows/uci1081-classical-completion.yml'
      - 'research/benchmarks/uci1081_completed_classical_v1.py'
      - 'research/benchmarks/test_uci1081_completed_classical_v1.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-locked-real-gas-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Freeze numerical/scientific package versions
        run: python -m pip install 'numpy==2.2.6' 'scikit-learn==1.6.1' 'xgboost==2.1.4'
      - name: Compile and run genuine algorithm contract tests
        run: |
          python -m compileall -q research/benchmarks
          python -m unittest discover -v -s research/benchmarks -p 'test_uci1081_completed_classical_v1.py'
      - name: Download and verify original UCI1081 source
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 20 --max-time 180 \
            'https://archive.ics.uci.edu/static/public/1081/gas%2Bsensor%2Barray%2Blow-concentration.zip' \
            --output uci1081_original.zip
          echo '813ebb7d00ed9172114b68d27ab3213170d6c220b8b23907dce91e9838cd48ab  uci1081_original.zip' | sha256sum --check
      - name: Execute three heldout-concentration source-domain folds
        shell: bash
        run: |
          set -euo pipefail
          python research/benchmarks/uci1081_completed_classical_v1.py \
            uci1081_original.zip --output uci1081_classical_completed_result.json | tee classical_metrics.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uci1081-genuine-lda-plsda-svm-xgboost-results
          path: |
            uci1081_classical_completed_result.json
            classical_metrics.txt
          if-no-files-found: warn
          retention-days: 90
