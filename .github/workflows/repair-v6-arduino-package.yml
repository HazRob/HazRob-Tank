name: Repackage clean V6 ESP32-Tank Arduino sketch (source QA only)

on:
  push:
    branches: [feature/tank-v8-implementation]
    paths:
      - '.github/workflows/repair-v6-arduino-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Verify first line, Arduino folder layout and source provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path("firmware/ESP32-Tank")
          sketch=root/"ESP32-Tank.ino"
          data=sketch.read_bytes()
          assert data.startswith(b"#include <WiFi.h>\n"),repr(data[:80])
          assert not data.startswith(b"DOI"),"Corrupted Arduino sketch prefix"
          assert b"#include <esp_wifi.h>" in data[:100]
          for name in ("Hardware.h","Hardware.cpp","Config.h","RemoteLink.h",
                       "RemoteLink.cpp","RemoteMqtt.h","RemoteMqtt.cpp",
                       "SafetyInterlock.h","SafetyInterlock.cpp","Alerts.h","Alerts.cpp"):
              assert (root/name).is_file(),name
          assert "0.1.6-v6-quickr0-dev" in (root/"Config.h").read_text()
          print("PASS first-line C++ sanity, source inventory and V6 version")
          PY
      - uses: arduino/setup-arduino-cli@v2
      - name: Install Arduino ESP32 core 3.3.11
        shell: bash
        run: |
          set -euo pipefail
          URL=https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index --additional-urls "$URL"
          arduino-cli core install esp32:esp32@3.3.11 --additional-urls "$URL"
      - name: Compile actual clean V6 Arduino source before packaging
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli compile --fqbn esp32:esp32:esp32 firmware/ESP32-Tank
      - name: Build verified Arduino ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, zipfile
          src=Path("firmware/ESP32-Tank")
          dst=Path("dist")
          dst.mkdir(exist_ok=True)
          out=dst/"HazRob-Tank-V6-ESP32-Tank-Arduino-CLEAN.zip"
          files=sorted(p for p in src.iterdir() if p.is_file() and
              p.suffix.lower() in {".ino",".cpp",".h",".md"} and
              not p.name.endswith("Secrets.h"))
          with zipfile.ZipFile(out,"w",compression=zipfile.ZIP_DEFLATED) as z:
              for file in files:
                  z.write(file,arcname="ESP32-Tank/"+file.name)
          with zipfile.ZipFile(out) as z:
              assert z.testzip() is None
              assert z.read("ESP32-Tank/ESP32-Tank.ino").startswith(b"#include <WiFi.h>\n")
              assert len([name for name in z.namelist() if name.endswith(".ino")])==1
          metadata={"source_revision":"${{ github.sha }}",
              "firmware":"ESP32-Tank 0.1.6-v6-quickr0-dev",
              "arduino_core":"esp32:esp32@3.3.11","fqbn":"esp32:esp32:esp32",
              "compiled_in_ci":True,"flashed_on_robot":False,
              "sha256":hashlib.sha256(out.read_bytes()).hexdigest()}
          (dst/"BUILD-VERIFICATION.json").write_text(json.dumps(metadata,indent=2)+"\n")
          (dst/"SHA256SUMS.txt").write_text(metadata["sha256"]+"  "+out.name+"\n")
          print(metadata)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: HazRob-Tank-V6-ESP32-Tank-CLEAN-Arduino
          path: dist/
          retention-days: 30
          if-no-files-found: error
