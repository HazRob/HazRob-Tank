name: ChemCore Tank V6 independent engine tests

on:
  push:
    branches: [feature/tank-v6-implementation]
    paths:
      - 'android/app/src/main/java/com/hazrob/tank/chemcore/v6/**'
      - 'research/chemcore_v6/tests/java/NewChemCoreTankV6EngineTest.java'
      - 'research/chemcore_v6/tests/java/GasFingerprintEngineV6Test.java'
      - 'research/chemcore_v6/tests/java/ChemCoreTankV6CoordinatorTest.java'
      - 'research/chemcore_v6/tests/java/SignalFeaturesV6Test.java'
      - 'research/chemcore_v6/tests/java/V6BatchTenDiagnosticsTest.java'
      - 'research/chemcore_v6/tests/java/V6SecondTenTechniquesTest.java'
      - 'research/chemcore_v6/tests/java/V6ThirdTenTechniquesTest.java'
      - 'research/chemcore_v6/tests/java/V6FourthTenTechniquesTest.java'
      - 'research/chemcore_v6/tests/java/V6FifthTenTechniquesTest.java'
      - 'research/chemcore_v6/tests/java/V6SixthTenTechniquesTest.java'
      - 'research/chemcore_v6/tests/java/V6SeventhNeuralTechniquesTest.java'
      - 'research/chemcore_v6/tests/java/V6OpenSetResearchTest.java'
      - 'research/chemcore_v6/tests/test_gas_fingerprint_reference_parity.py'
      - 'research/chemcore_v6/tests/test_independent_v6_catalog_parity.py'
      - '.github/workflows/chemcore-v6-independent-engine-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-v6-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile new engine without prior ChemCore implementation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/chemcore-tank-new-v6
          javac -d /tmp/chemcore-tank-new-v6 \
            android/app/src/main/java/com/hazrob/tank/chemcore/v6/SourceCatalog.java \
            android/app/src/main/java/com/hazrob/tank/chemcore/v6/AlternativeCurveCatalog.java \
            android/app/src/main/java/com/hazrob/tank/chemcore/v6/Engine.java \
            android/app/src/main/java/com/hazrob/tank/chemcore/v6/GasFingerprintCatalogV6.java \
            android/app/src/main/java/com/hazrob/tank/chemcore/v6/FingerprintEngineV6.java \
            android/app/src/main/java/com/hazrob/tank/chemcore/v6/ChemCoreTankV6.java \
            android/app/src/main/java/com/hazrob/tank/chemcore/v6/SignalFeaturesV6.java \
            android/app/src/main/java/com/hazrob/tank/chemcore/v6/MeasurementDiagnosticsV6.java \
            android/app/src/main/java/com/hazrob/tank/chemcore/v6/ResearchDiagnosticsV6.java \
            android/app/src/main/java/com/hazrob/tank/chemcore/v6/CalibrationResearchV6.java \
            android/app/src/main/java/com/hazrob/tank/chemcore/v6/ClassicalLearningV6.java \
            android/app/src/main/java/com/hazrob/tank/chemcore/v6/EvidenceConflictV6.java \
            android/app/src/main/java/com/hazrob/tank/chemcore/v6/SourceValidationV6.java \
            android/app/src/main/java/com/hazrob/tank/chemcore/v6/SourceNumericsV6.java \
            android/app/src/main/java/com/hazrob/tank/chemcore/v6/TemporalSpatialResearchV6.java \
            android/app/src/main/java/com/hazrob/tank/chemcore/v6/SupervisedLearningResearchV6.java \
            android/app/src/main/java/com/hazrob/tank/chemcore/v6/AdaptationEvidenceResearchV6.java \
            android/app/src/main/java/com/hazrob/tank/chemcore/v6/TemporalNeuralResearchV6.java \
            android/app/src/main/java/com/hazrob/tank/chemcore/v6/OpenSetResearchV6.java \
            research/chemcore_v6/tests/java/NewChemCoreTankV6EngineTest.java \
            research/chemcore_v6/tests/java/GasFingerprintEngineV6Test.java \
            research/chemcore_v6/tests/java/ChemCoreTankV6CoordinatorTest.java \
            research/chemcore_v6/tests/java/SignalFeaturesV6Test.java \
            research/chemcore_v6/tests/java/V6BatchTenDiagnosticsTest.java \
            research/chemcore_v6/tests/java/V6SecondTenTechniquesTest.java \
            research/chemcore_v6/tests/java/V6ThirdTenTechniquesTest.java \
            research/chemcore_v6/tests/java/V6FourthTenTechniquesTest.java \
            research/chemcore_v6/tests/java/V6FifthTenTechniquesTest.java \
            research/chemcore_v6/tests/java/V6SixthTenTechniquesTest.java \
            research/chemcore_v6/tests/java/V6SeventhNeuralTechniquesTest.java \
            research/chemcore_v6/tests/java/V6OpenSetResearchTest.java
          java -cp /tmp/chemcore-tank-new-v6 \
            com.hazrob.tank.chemcore.v6.NewChemCoreTankV6EngineTest
          java -cp /tmp/chemcore-tank-new-v6 \
            com.hazrob.tank.chemcore.v6.GasFingerprintEngineV6Test
          java -cp /tmp/chemcore-tank-new-v6 \
            com.hazrob.tank.chemcore.v6.ChemCoreTankV6CoordinatorTest
          java -cp /tmp/chemcore-tank-new-v6 \
            com.hazrob.tank.chemcore.v6.SignalFeaturesV6Test
          java -cp /tmp/chemcore-tank-new-v6 \
            com.hazrob.tank.chemcore.v6.V6BatchTenDiagnosticsTest
          java -cp /tmp/chemcore-tank-new-v6 \
            com.hazrob.tank.chemcore.v6.V6SecondTenTechniquesTest
          java -cp /tmp/chemcore-tank-new-v6 \
            com.hazrob.tank.chemcore.v6.V6ThirdTenTechniquesTest
          java -cp /tmp/chemcore-tank-new-v6 \
            com.hazrob.tank.chemcore.v6.V6FourthTenTechniquesTest
          java -cp /tmp/chemcore-tank-new-v6 \
            com.hazrob.tank.chemcore.v6.V6FifthTenTechniquesTest
          java -cp /tmp/chemcore-tank-new-v6 \
            com.hazrob.tank.chemcore.v6.V6SixthTenTechniquesTest
          java -cp /tmp/chemcore-tank-new-v6 \
            com.hazrob.tank.chemcore.v6.V6SeventhNeuralTechniquesTest
          java -cp /tmp/chemcore-tank-new-v6 \
            com.hazrob.tank.chemcore.v6.V6OpenSetResearchTest
      - name: Verify all 43 coefficients match immutable original source
        run: |
          python -m unittest discover -s research/chemcore_v6/tests -p 'test_independent_v6_catalog_parity.py' -v
          python -m unittest discover -s research/chemcore_v6/tests -p 'test_gas_fingerprint_reference_parity.py' -v
      - name: Verify isolated dependency boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -nE '^import (com[.]servoc|android[.]|org[.]json)' \
            android/app/src/main/java/com/hazrob/tank/chemcore/v6
          echo "New inference engine JDK-only, standalone, source-pinned; no physical calibration claim"
