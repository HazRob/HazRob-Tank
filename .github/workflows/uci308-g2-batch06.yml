name: HazRob Tank G2-06 UCI308 temporal plus robotic-eligibility audit
on:
  push:
    paths:
      - '.github/workflows/uci308-g2-batch06.yml'
      - 'research/benchmarks/uci308_g2_batch06_v1.py'
      - 'research/benchmarks/test_uci308_g2_batch06_v1.py'
      - 'research/benchmarks/uci308_g2_batch05_v1.py'
      - 'research/benchmarks/uci1081_actual_modules_v1.py'
      - 'research/techniques/08.1/**'
      - 'research/techniques/08.2/**'
      - 'research/techniques/08.3/**'
      - 'research/techniques/08.4/**'
      - 'research/techniques/08.5/**'
      - 'research/techniques/08.6/**'
      - 'research/techniques/08.7/**'
      - 'research/techniques/09.1/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verified-uci308-g2-06:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify G2-06 synthetic protocol invariants
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q research/benchmarks/uci308_g2_batch06_v1.py research/benchmarks/test_uci308_g2_batch06_v1.py
          python -m unittest discover -v -s research/benchmarks -p 'test_uci308_g2_batch06_v1.py' 2>&1 | tee unit_checks.log
          grep -Eq '^Ran (1[0-9]|[2-9][0-9]+) tests?' unit_checks.log
          grep -Eq '^OK$' unit_checks.log
      - name: Download original UCI308 and verify pinned SHA
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 20 --max-time 180 \
            'https://archive.ics.uci.edu/static/public/308/gas%2Bsensor%2Barray%2Bunder%2Bflow%2Bmodulation.zip' \
            -o uci308_original.zip
          echo '7b062960dbef1a9e8aefc62bc7dbac09bdadb8cbb40793cf2b8e122da1862f90  uci308_original.zip' | sha256sum --check
      - name: Run 10-technique evidence/eligibility assessment on actual raw sensor traces
        shell: bash
        run: |
          set -euo pipefail
          python research/benchmarks/uci308_g2_batch06_v1.py uci308_original.zip --output uci308_g2_batch06_result.json | tee uci308_g2_batch06.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uci308-g2-batch06-external-data-evidence
          path: |
            unit_checks.log
            uci308_g2_batch06_result.json
            uci308_g2_batch06.log
          if-no-files-found: warn
          retention-days: 90
