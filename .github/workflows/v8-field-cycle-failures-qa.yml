name: HazRob Tank V8 Field Cycle FAIL diagnosis and regression (non-release)

on:
  push:
    branches: [feature/tank-v8-implementation]
    paths:
      - 'android/app/src/main/java/com/servoc/app/field/FieldCycleRepository.java'
      - 'android/app/src/main/java/com/servoc/app/ui/FieldSessionsTab.java'
      - 'android/app/src/main/java/com/servoc/app/measurement/FieldCycleController.java'
      - 'android/app/src/main/java/com/servoc/app/measurement/TelemetryRecorder.java'
      - 'android/app/src/main/java/com/servoc/app/chemcore/CompletedSessionChemCoreAnalyzer.java'
      - 'android/app/src/test/java/com/servoc/app/field/TankV8FieldCycleFailureDiagnosticsTest.java'
      - '.github/workflows/v8-field-cycle-failures-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-field-cycle-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: tank
      - uses: actions/checkout@v4
        with:
          repository: sohpany/SERVOC-Android
          ref: 6281d3eb7c1c961ce63b0b5e4ae0792874626720
          token: ${{ secrets.HAZROB_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
      - name: Overlay HazRob Tank V8 Android sources and test fixtures
        shell: bash
        run: |
          set -euo pipefail
          cp -a tank/android/app/src/main/java/. source/app/src/main/java/
          # Field-cycle-only QA: isolate the separate, unfinished MQSpaceData
          # research compilation blocker in this throwaway checkout. No V8
          # source file is altered and no distributable APK is produced.
          rm -rf source/app/src/main/java/com/hazrob/tank/chemcore/v7
          if test -d tank/android/app/src/main/res; then cp -a tank/android/app/src/main/res/. source/app/src/main/res/; fi
          if test -d tank/android/app/src/main/assets; then mkdir -p source/app/src/main/assets; cp -a tank/android/app/src/main/assets/. source/app/src/main/assets/; fi
          if test -d tank/android/app/src/test/java; then mkdir -p source/app/src/test/java; cp -a tank/android/app/src/test/java/. source/app/src/test/java/; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Compile complete app and run focused field-cycle regression suites
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:compileDebugJavaWithJavac
          gradle --no-daemon :app:testDebugUnitTest \
            --tests com.servoc.app.field.TankV8FieldCycleFailureDiagnosticsTest \
            --tests com.servoc.app.field.FieldSessionApprovalPolicyTest \
            --tests com.servoc.app.chemcore.CompletedSessionChemCoreAnalyzerTest
      - name: Report tested source revision
        shell: bash
        run: |
          echo "V8 source revision: $(git -C tank rev-parse HEAD)"
          echo "NOT A DEVICE BENCH PASS; real ESP32 and Android field-cycle tests remain required."
