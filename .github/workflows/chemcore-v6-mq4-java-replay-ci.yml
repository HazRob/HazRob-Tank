name: ChemCore V6 ORIGINAL MQ4 through actual Java V6 coordinator and source PLS1
on:
  push:
    branches: [feature/tank-v6-implementation]
    paths:
      - 'research/chemcore_v6/benchmarks/MinnesotaMq4JavaV6Replay.java'
      - '.github/workflows/chemcore-v6-mq4-java-replay-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-mq4-in-java-v6:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Acquire original archived physical MQ4/Li-Cor gas data with immutable SHA256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v6-mq4-java
          curl --fail --location --retry 3 --max-time 90 \
            "https://conservancy.umn.edu/server/api/core/bitstreams/1542d00c-67b4-4a61-93f3-48ee1dd97208/content" \
            --output /tmp/v6-mq4-java/10ppm_data.csv
          echo '3c27c4f8b8e8aab54b6433acfa41de00890a9eefd19376259a2371f22a48ff2d  /tmp/v6-mq4-java/10ppm_data.csv' | sha256sum -c -
      - name: Compile actual independent V6 coordinator and reference regression source numerics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v6-mq4-java/classes
          javac -d /tmp/v6-mq4-java/classes \
            android/app/src/main/java/com/hazrob/tank/chemcore/v6/SourceCatalog.java \
            android/app/src/main/java/com/hazrob/tank/chemcore/v6/AlternativeCurveCatalog.java \
            android/app/src/main/java/com/hazrob/tank/chemcore/v6/Engine.java \
            android/app/src/main/java/com/hazrob/tank/chemcore/v6/GasFingerprintCatalogV6.java \
            android/app/src/main/java/com/hazrob/tank/chemcore/v6/FingerprintEngineV6.java \
            android/app/src/main/java/com/hazrob/tank/chemcore/v6/EvidenceConflictV6.java \
            android/app/src/main/java/com/hazrob/tank/chemcore/v6/ChemCoreTankV6.java \
            android/app/src/main/java/com/hazrob/tank/chemcore/v6/SourceNumericsV6.java \
            research/chemcore_v6/benchmarks/MinnesotaMq4JavaV6Replay.java
      - name: Replay ALL 14186 original independent Li-Cor MQ4 records through actual V6 Java inference
        shell: bash
        run: |
          set -euo pipefail
          java -Xmx768m -cp /tmp/v6-mq4-java/classes \
            com.hazrob.tank.chemcore.v6.MinnesotaMq4JavaV6Replay \
            /tmp/v6-mq4-java/10ppm_data.csv \
            /tmp/v6-mq4-java/v6_coordinator_raw_no_r0_audit.csv \
            /tmp/v6-mq4-java/v6_pls1_whole_day_source_folds.csv \
            /tmp/v6-mq4-java/v6_pls1_whole_day_heldout_predictions.csv \
            /tmp/v6-mq4-java/v6_pls1_unseen_unit_and_day_transfer.csv
      - name: Validate scientific holdout and raw-preservation evidence and quantify actual source results
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,collections,statistics,math,json,pathlib
          root=pathlib.Path('/tmp/v6-mq4-java')
          def rows(name):
            with (root/name).open(newline='',encoding='utf-8') as f: return list(csv.DictReader(f))
          audit=rows('v6_coordinator_raw_no_r0_audit.csv')
          folds=rows('v6_pls1_whole_day_source_folds.csv')
          pred=rows('v6_pls1_whole_day_heldout_predictions.csv')
          transfer=rows('v6_pls1_unseen_unit_and_day_transfer.csv')
          assert len(audit)==14186 and len(folds)==44 and len(pred)==56744
          assert len(transfer)==33
          assert len({r['source_row_id'] for r in audit})==14186
          days=sorted({r['source_day'] for r in audit})
          assert len(days)==11 and days[0]=='2021-07-21' and days[-1]=='2021-07-31'
          assert all((r['retained_channels'],r['channels_missing_r0'],r['ratio_ready'],
                      r['source_curve_fits'],r['chemical_hypotheses'])==
                     ('3','3','0','0','0') for r in audit)
          assert all(r['reportable_ppm']=='false' and r['physical_tank_g3']=='false'
                     and r['food_data_used']=='false' for r in audit)
          names=['SOURCE_TRAIN_MEDIAN','V6_PLS1_MQ4_UNIT1',
                 'V6_PLS1_MQ4_THREE','V6_PLS1_MQ4_THREE_T_RH']
          summary={}
          for name in names:
            df=[r for r in folds if r['model']==name]
            source_preds=[r for r in pred if r['model']==name]
            assert len(df)==11 and len(source_preds)==14186
            assert len({r['source_row_id'] for r in source_preds})==14186
            assert {r['test_day'] for r in df}==set(days)
            assert all(r['train_days']=='9' and r['test_day']!=r['calibration_day']
                       and r['no_tank_g3']=='true' for r in df)
            errors=[float(r['absolute_error_ppm']) for r in source_preds]
            rmse=math.sqrt(statistics.mean(
                (float(r['source_research_estimate_ppm'])-
                 float(r['licor_reference_ppm']))**2 for r in source_preds))
            cover=sum(r['interval_contains_reference']=='true' for r in source_preds)/len(source_preds)
            tn=sum(int(r['analytical_4ppm_TN']) for r in df)
            tp=sum(int(r['analytical_4ppm_TP']) for r in df)
            fn=sum(int(r['analytical_4ppm_FN']) for r in df)
            fp=sum(int(r['analytical_4ppm_FP']) for r in df)
            assert tp+fn==sum(float(r['licor_reference_ppm'])>=4 for r in source_preds)
            assert tp+fn+tn+fp==14186
            nonphysical=sum(r['source_prediction_nonphysical']=='true' for r in source_preds)
            summary[name]={'total_source_test_rows':14186,'MAE_ppm':statistics.mean(errors),
                           'RMSE_ppm':rmse,'empirical_90pct_interval_coverage':cover,
                           'true_positive':tp,'false_negative':fn,
                           'false_positive':fp,'true_negative':tn,
                           'nonpositive_source_estimates':nonphysical,
                           '4ppm_analytical_sensitivity':tp/(tp+fn) if tp+fn else None}
            print('MQ4_JAVA_ACTUAL_V6',name,json.dumps(summary[name],sort_keys=True))
          assert len({(x['heldout_day'],x['heldout_sensor_instance']) for x in transfer})==33
          assert all(x['heldout_sensor_instance'] not in x['training_instances'].split('|')
                     and x['training_days']=='9' and x['true_source_unit_excluded_from_fit']=='true'
                     and x['source_only']=='true' and x['no_tank_g3']=='true'
                     for x in transfer)
          import statistics as st
          transfer_mae=st.mean(float(x['source_mae_ppm']) for x in transfer)
          transfer_coverage=st.mean(float(x['test_interval_coverage']) for x in transfer)
          print('N05K_JAVA_UNIT_DAY_SOURCE_TRANSFER 33 folds mean_MAE_ppm',round(transfer_mae,6),
                'mean_nominal90_coverage',round(transfer_coverage,6))
          manifest={'schema':'hazrob-v6-java-real-mq4-day-holdout/1',
                    'original_source_sha256':'3c27c4f8b8e8aab54b6433acfa41de00890a9eefd19376259a2371f22a48ff2d',
                    'source_rows':14186,'reference_gas':'CH4','source_reference_unit':'ppb',
                    'source_resistance_unit':'ohm','source_hardware_instances':3,
                    'source_day_holds':11,'whole_day_model_folds':44,
                    'coordinator_replayed_all_original_rows':True,
                    'coordinator_gas_identity_hypotheses_without_r0':0,
                    'coordinator_reportable_ppm':False,
                    'external_pls1_source_research_not_tank_calibration':True,
                    'physical_tank_g3':0,'android_app_device_tested':False,
                    'food_model_attached':False,
                    'fixed_4ppm_cutoff_is_only_research_diagnostic':True,
                    'models':summary,
                    'unseen_unit_and_day_transfer_folds':33,
                    'unseen_unit_and_day_transfer_mean_MAE_ppm':transfer_mae,
                    'unseen_unit_and_day_transfer_mean_coverage':transfer_coverage}
          (root/'v6_mq4_java_replay_manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print('PASS N05-J/K SOURCE EXACT JAVA ENGINE 14186 ORIGINAL MQ4, 44 WHOLE DAY FOLDS, 56744 HELDOUT PREDICTIONS, 33 UNSEEN SENSOR+DAY TRANSFERS; G3=0')
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: HazRob-Tank-V6-Java-MQ4-Original-Source-Replay-and-PLS1
          path: |
            /tmp/v6-mq4-java/v6_coordinator_raw_no_r0_audit.csv
            /tmp/v6-mq4-java/v6_pls1_whole_day_source_folds.csv
            /tmp/v6-mq4-java/v6_pls1_whole_day_heldout_predictions.csv
            /tmp/v6-mq4-java/v6_mq4_java_replay_manifest.json
          retention-days: 30
