name: Tank G3-readiness source schema and exposure leakage tests
on:
  push:
    paths:
      - '.github/workflows/tank-g3-measurement-schema.yml'
      - 'research/benchmarks/tank_measurement_adapter_v1.py'
      - 'research/benchmarks/test_tank_measurement_adapter_v1.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-schema-and-group-independence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate syntax, provenance and exposure-isolation tests
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q research/benchmarks/tank_measurement_adapter_v1.py
          python -m unittest discover -v -s research/benchmarks -p 'test_tank_measurement_adapter_v1.py' 2>&1 | tee tank_g3_schema_test.log
          grep -Eq '^Ran ([1-9][0-9]|[1-9][0-9][0-9]+) tests' tank_g3_schema_test.log
          grep -Eq '^OK$' tank_g3_schema_test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tank-g3-schema-test-protocol
          path: tank_g3_schema_test.log
          if-no-files-found: warn
          retention-days: 90
