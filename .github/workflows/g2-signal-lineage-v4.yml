name: "Tank V4 G2 — source signal and R0 evidence gate"
on:
  push:
    branches:
      - research/chemcore80-central-evidence-gap-analysis-20261021
    paths:
      - 'research/implementation_execution/g2_*.py'
      - 'research/implementation_execution/test_g2_*.py'
      - 'research/implementation_execution/G2_UCI1081_SIGNAL_R0_PROVENANCE_2026-10-26.json'
      - 'research/implementation_execution/G2_INDEPENDENT_EVIDENCE.json'
      - 'research/implementation_execution/EXECUTION_LEDGER_2026-10-21.json'
      - 'research/g2/evidence/**'
      - '.github/workflows/g2-signal-lineage-v4.yml'
  pull_request:
    paths:
      - 'research/implementation_execution/g2_*.py'
      - 'research/implementation_execution/test_g2_*.py'
      - 'research/implementation_execution/G2_UCI1081_SIGNAL_R0_PROVENANCE_2026-10-26.json'
      - 'research/implementation_execution/G2_INDEPENDENT_EVIDENCE.json'
      - 'research/implementation_execution/EXECUTION_LEDGER_2026-10-21.json'
      - 'research/g2/evidence/**'
      - '.github/workflows/g2-signal-lineage-v4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  g2-signal-lineage-fail-closed:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: "Compile and execute G2 negative source/R0 controls"
        run: |
          python -m compileall -q research/implementation_execution/g2_signal_lineage_gate.py research/implementation_execution/g2_evidence_audit.py research/implementation_execution/g2_evidence_bundle_gate.py
          cd research/implementation_execution
          python -m unittest -v test_g2_signal_lineage_gate test_g2_evidence_audit test_g2_evidence_bundle_gate test_g2_uci1081_signal_manifest
      - name: "Run full 80-technique G2 fail-closed evidence audit"
        run: |
          python research/implementation_execution/g2_evidence_audit.py --output "$RUNNER_TEMP/g2_audit_results.json"
          python - "$RUNNER_TEMP/g2_audit_results.json" <<'PY'
          import json, sys
          x = json.load(open(sys.argv[1]))
          records = x["records"]
          assert len(records) == 80
          assert len({r["id"] for r in records}) == 80
          assert x["g2_pass_candidates"] + x["g2_blocked"] == 80
          assert all(r["status"] in {"G2_BLOCKED", "G2_PASS_CANDIDATE_REQUIRES_REVIEW"} for r in records)
          assert not any(r["status"] == "G2_PASS" for r in records)
          print("G2 review-only candidates:", x["g2_pass_candidates"],
                "blocked:", x["g2_blocked"])
          PY
      - name: "Upload reproducible G2 gate output"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tank-v4-g2-signal-r0-gate
          path: ${{ runner.temp }}/g2_audit_results.json
          if-no-files-found: ignore
