name: HazRob Tank V6 N15 Android12 Stable update rollback and tamper acceptance

on:
  push:
    branches: [feature/tank-v6-implementation]
    paths:
      - 'android/app/src/main/java/com/servoc/app/chemcore/library/**'
      - 'research/chemcore_v6/tests/android/V6StableUpdateEmulatorActivity.java'
      - 'research/chemcore_v6/tests/android/run_n15_stable_update_e2e.sh'
      - '.github/workflows/chemcore-v6-n15-stable-android12-rollback-e2e.yml'
      - 'tools/prepare_v6_stable_source.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-real-android12-stable-rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout independent Tank V6
        uses: actions/checkout@v4
        with:
          path: tank
      - name: Checkout pinned historical scientific Android source
        uses: actions/checkout@v4
        with:
          repository: sohpany/SERVOC-Android
          ref: 6281d3eb7c1c961ce63b0b5e4ae0792874626720
          token: ${{ secrets.HAZROB_SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - name: Overlay Tank V6 read-only updater and test Activity
        shell: bash
        run: |
          set -euo pipefail
          cp -a tank/android/app/src/main/java/. source/app/src/main/java/
          mkdir -p source/app/src/main/java/com/servoc/app/chemcore/library
          cp tank/research/chemcore_v6/tests/android/V6StableUpdateEmulatorActivity.java \
             source/app/src/main/java/com/servoc/app/chemcore/library/V6StableUpdateEmulatorActivity.java
          mkdir -p source/tools source/app/src/main/assets
          cp tank/tools/prepare_v6_stable_source.py source/tools/prepare_v6_stable_source.py
          if test -d tank/android/app/src/main/assets; then
            cp -a tank/android/app/src/main/assets/. source/app/src/main/assets/
          fi
          if test -d tank/android/app/src/main/res; then
            cp -a tank/android/app/src/main/res/. source/app/src/main/res/
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re
          gradle=Path('source/app/build.gradle')
          s=gradle.read_text(encoding='utf-8')
          for a,b in (("applicationId 'com.servoc.app'","applicationId 'com.hazrob.tank'"),
                      ("versionName '0.10.2'","versionName '6.0'"),
                      ("versionCode 30","versionCode 6")):
              assert a in s, a
              s=s.replace(a,b)
          gradle.write_text(s,encoding='utf-8')
          manifest=Path('source/app/src/main/AndroidManifest.xml')
          x=manifest.read_text(encoding='utf-8')
          key='<activity android:name=".MainActivity" android:exported="false"/>'
          assert key in x, 'missing pinned Android activity anchor'
          x=x.replace(key,
              '<activity android:name="com.servoc.app.chemcore.library.V6StableUpdateEmulatorActivity" android:exported="true"/>\n        '+key)
          manifest.write_text(x,encoding='utf-8')
          PY
          python3 source/tools/prepare_v6_stable_source.py source
      - name: Create real stable snapshot and two test-only versioned manifests
        shell: bash
        run: |
          set -euo pipefail
          (cd source && python3 tools/build_hr069_embedded_stable.py \
            --out-dir app/build/generated/hazrobAssets/generated/chemcore/embedded_stable)
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          original=Path('source/app/build/generated/hazrobAssets/generated/chemcore/embedded_stable')
          directory=Path('source/app/src/main/assets/test_only/v6_stable')
          directory.mkdir(parents=True,exist_ok=True)
          manifest=json.loads((original/'manifest.json').read_text(encoding='utf-8'))
          raw=(original/'chemcore-stable-snapshot.json').read_bytes()
          assert manifest['payload_sha256']==hashlib.sha256(raw).hexdigest()
          assert manifest['payload_size_bytes']==len(raw)
          assert manifest['min_app_version']==manifest['max_app_version']=='6.0'
          assert manifest['chemical_count']==652
          assert manifest['calibration_count']==manifest['model_count']==0
          assert json.loads(raw)['content_counts']['response_priors']==49
          (directory/'chemcore-stable-snapshot.json').write_bytes(raw)
          for v,label in [('1.0.1-hr069r1','v1'),('1.0.2-hr069r1','v2')]:
              item=manifest.copy()
              item['library_version']=v
              (directory/(label+'-manifest.json')).write_text(
                  json.dumps(item,sort_keys=True,separators=(',',':'))+'\n',encoding='utf-8')
          print('Test only: two real-payload manifests, provenance and size verified')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android API36
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Temporary emulator-only signing
        shell: bash
        run: |
          mkdir -p source/signing
          keytool -genkeypair -alias hazrob-prototype \
            -keystore source/signing/hazrob-prototype.jks \
            -storepass hazrob-prototype -keypass hazrob-prototype \
            -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=N15 CI ONLY, OU=NOT PRODUCTION, O=HazRob TEST" -noprompt
      - name: Build disposable emulator-only Android test app (NOT V6 APK release)
        working-directory: source
        run: gradle --no-daemon :app:assembleDebug
      - name: Enable KVM
        run: |
          if test -c /dev/kvm; then sudo chmod a+rw /dev/kvm; fi
      - name: Exercise actual Android12 Stable install, corrupt source and rollback
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          script: bash tank/research/chemcore_v6/tests/android/run_n15_stable_update_e2e.sh
      - name: Upload test evidence only — never publish a Stable source or release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HazRob-Tank-V6-N15-Android12-Verified-Stable-Rollback
          path: /tmp/v6-n15/
          if-no-files-found: warn
          retention-days: 30
