name: G2 physical evidence intake preflight
on:
  push:
    branches:
      - 'research/chemcore80-central-evidence-gap-analysis-20261021'
    paths:
      - 'research/implementation_execution/g2_physical_intake_gate.py'
      - 'research/implementation_execution/g2_holdout_guard.py'
      - 'research/implementation_execution/test_g2_holdout_guard.py'
      - '.github/workflows/g2-physical-intake-preflight.yml'
  pull_request:
    paths:
      - 'research/implementation_execution/g2_physical_intake_gate.py'
      - 'research/implementation_execution/g2_holdout_guard.py'
      - 'research/implementation_execution/test_g2_holdout_guard.py'
      - '.github/workflows/g2-physical-intake-preflight.yml'
  workflow_dispatch:
jobs:
  physical-intake-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check
        run: python -m py_compile research/implementation_execution/g2_physical_intake_gate.py
      - name: Fail-closed regression tests
        run: python research/implementation_execution/g2_physical_intake_gate.py --self-test
      - name: Holdout leakage guard regression tests (research preflight only)
        run: python -m unittest discover -s research/implementation_execution -p 'test_g2_holdout_guard.py' -v
      - name: Holdout guard syntax check
        run: python -m py_compile research/implementation_execution/g2_holdout_guard.py research/implementation_execution/test_g2_holdout_guard.py
